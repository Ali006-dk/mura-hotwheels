<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mura 🏎️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
            overflow: hidden;
        }

        .inicio {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .luna {
            font-size: 90px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            font-size: 20px;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        button {
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            background: white;
            color: #07111f;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.08);
        }
    </style>
</head>

<body>

    <main class="inicio">
        <div class="luna">🌙</div>

        <h1>Hey, Mura...</h1>

        <p>Preparé una pequeña cosa para ti. 💗</p>

        <button onclick="comenzar()">
            Empezar 🏎️
        </button>
    </main>

    <script>
        function comenzar() {
            alert("Nuestro viaje comienza aquí 🏎️🌙");
        }
    </script>

</body>
</html>
