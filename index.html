<html lang="es">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para alguien especial 🌙</title>

<style>

/* ==================================================
   BASE
================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #050b18;
    font-family: Georgia, "Times New Roman", serif;
}


/* ==================================================
   ESCENA
================================================== */

.escena {

    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;

    background-image:
        url("bosque-noche.jpg");

    background-size: cover;
    background-position: center;

    background-color: #050b18;

}


/* ==================================================
   PAISAJE DEL ATARDECER
================================================== */

.escena::before {

    content: "";

    position: absolute;

    inset: 0;

    background-image:
        url("paisaje.png");

    background-size: cover;
    background-position: center;

    opacity: 0;

    transform: scale(1.04);

    z-index: 1;

    pointer-events: none;

    transition:
        opacity 2.8s ease,
        transform 6s ease;

}

.escena.iniciado::before {

    opacity: 1;

    transform: scale(1);

}


/* ==================================================
   BRILLO GENERAL DEL SOL
================================================== */

.escena::after {

    content: "";

    position: absolute;

    width: 55vw;
    height: 55vw;

    max-width: 650px;
    max-height: 650px;

    left: 47%;
    top: 38%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,196,125,0.14) 0%,
            rgba(255,155,105,0.07) 28%,
            transparent 70%
        );

    opacity: 0;

    z-index: 3;

    pointer-events: none;

    mix-blend-mode: screen;

}

.escena.iniciado::after {

    opacity: 1;

    animation:
        brilloSol 5s ease-in-out infinite;

}

@keyframes brilloSol {

    0%,
    100% {
        transform:
            translate(-50%, -50%)
            scale(.92);

        opacity: .65;
    }

    50% {
        transform:
            translate(-50%, -50%)
            scale(1.08);

        opacity: 1;
    }

}


/* ==================================================
   OSCURIDAD SUAVE
================================================== */

.oscuridad {

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(7,14,35,.22),
            rgba(20,15,35,.08),
            rgba(7,10,25,.25)
        );

    z-index: 4;

    pointer-events: none;

    opacity: 0;

    transition:
        opacity 2.5s ease;

}

.escena.iniciado .oscuridad {

    opacity: 1;

}


/* ==================================================
   LUNA DE LA ESCENA INICIAL
================================================== */

.luz-luna {

    position: absolute;

    width: 500px;
    height: 500px;

    top: -180px;
    left: 0;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(160,185,255,.13),
            rgba(100,130,210,.06) 35%,
            transparent 70%
        );

    z-index: 5;

    pointer-events: none;

    transition:
        opacity 2s ease;

}

.escena.iniciado .luz-luna {

    opacity: 0;

}


/* ==================================================
   ESTRELLAS DE LA NOCHE INICIAL
================================================== */

.estrellas {

    position: absolute;

    inset: 0;

    z-index: 6;

    pointer-events: none;

    transition:
        opacity 2s ease;

}

.estrella-noche {

    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: rgba(225,235,255,.85);

    box-shadow:
        0 0 6px rgba(190,215,255,.7);

    animation:
        brillarNoche 4s ease-in-out infinite alternate;

}

@keyframes brillarNoche {

    from {
        opacity: .25;
        transform: scale(.7);
    }

    to {
        opacity: .9;
        transform: scale(1.4);
    }

}

.escena.iniciado .estrellas {

    opacity: 0;

}


/* ==================================================
   NIEBLA
================================================== */

.niebla {

    position: absolute;

    width: 130%;
    height: 30%;

    left: -15%;
    bottom: -8%;

    background:
        radial-gradient(
            ellipse,
            rgba(210,220,245,.09),
            transparent 70%
        );

    filter: blur(18px);

    z-index: 7;

    pointer-events: none;

    opacity: .5;

    animation:
        moverNiebla 12s ease-in-out infinite alternate;

}

@keyframes moverNiebla {

    from {
        transform: translateX(-3%);
    }

    to {
        transform: translateX(3%);
    }

}

.escena.iniciado .niebla {

    opacity: .16;

}


/* ==================================================
   LUCIÉRNAGAS
================================================== */

.luciernagas {

    position: absolute;

    inset: 0;

    z-index: 10;

    pointer-events: none;

    opacity: 0;

    transition:
        opacity 2s ease;

}

.escena.iniciado .luciernagas {

    opacity: 1;

}

.luz {

    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background:
        rgba(255,235,145,.95);

    box-shadow:
        0 0 5px rgba(255,230,120,.9),
        0 0 14px rgba(255,190,80,.55);

    animation:
        luciernaga
        var(--duracion, 5s)
        ease-in-out
        infinite alternate;

}

.luz.pequena {

    width: 3px;
    height: 3px;

    box-shadow:
        0 0 5px rgba(255,230,130,.75);

}

@keyframes luciernaga {

    0% {

        opacity: .25;

        transform:
            translate(0, 0)
            scale(.7);

    }

    30% {

        opacity: .9;

    }

    60% {

        transform:
            translate(
                var(--x1),
                var(--y1)
            )
            scale(1.15);

        opacity: .45;

    }

    100% {

        opacity: 1;

        transform:
            translate(
                var(--x2),
                var(--y2)
            )
            scale(.8);

    }

}


/* ==================================================
   DESTELLOS PEQUEÑOS
================================================== */

.destellos {

    position: absolute;

    inset: 0;

    z-index: 11;

    pointer-events: none;

    opacity: 0;

    transition:
        opacity 2s ease;

}

.escena.iniciado .destellos {

    opacity: 1;

}

.destello {

    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: rgba(255,220,170,.9);

    box-shadow:
        0 0 8px rgba(255,205,140,.75);

    animation:
        destelloSol
        var(--duracion)
        ease-in-out
        infinite;

}

@keyframes destelloSol {

    0%,
    100% {

        opacity: .1;

        transform: scale(.5);

    }

    50% {

        opacity: .8;

        transform: scale(1.5);

    }

}


/* ==================================================
   HOJAS QUE CAEN
================================================== */

.hojas {

    position: absolute;

    inset: 0;

    z-index: 12;

    pointer-events: none;

    opacity: 0;

    transition:
        opacity 2s ease;

}

.escena.iniciado .hojas {

    opacity: 1;

}

.hoja {

    position: absolute;

    top: -30px;

    width: 10px;
    height: 6px;

    border-radius:
        100% 0 100% 0;

    background:
        rgba(210,155,100,.78);

    filter:
        drop-shadow(
            0 0 4px rgba(255,190,120,.25)
        );

    animation:
        caerHoja
        var(--duracion)
        linear
        infinite;

    animation-delay:
        var(--delay);

}

@keyframes caerHoja {

    0% {

        transform:
            translate(
                0,
                -30px
            )
            rotate(0deg);

        opacity: 0;

    }

    10% {

        opacity: .8;

    }

    45% {

        transform:
            translate(
                45px,
                45vh
            )
            rotate(150deg);

    }

    75% {

        transform:
            translate(
                -15px,
                75vh
            )
            rotate(260deg);

    }

    100% {

        transform:
            translate(
                65px,
                110vh
            )
            rotate(390deg);

        opacity: 0;

    }

}


/* ==================================================
   MOVIMIENTO DEL AGUA
================================================== */

.agua {

    position: absolute;

    left: 0;
    right: 0;

    bottom: 0;

    height: 43%;

    z-index: 8;

    pointer-events: none;

    opacity: 0;

    transition:
        opacity 2.5s ease;

    overflow: hidden;

}

.escena.iniciado .agua {

    opacity: 1;

}

.onda {

    position: absolute;

    width: 150%;

    height: 100px;

    left: -25%;

    border-top:
        1px solid
        rgba(255,215,180,.08);

    border-radius: 50%;

    filter: blur(.4px);

    animation:
        moverAgua
        var(--duracion)
        ease-in-out
        infinite alternate;

}

.onda:nth-child(1) {

    top: 18%;

    opacity: .7;

}

.onda:nth-child(2) {

    top: 35%;

    opacity: .45;

    animation-delay: -2s;

}

.onda:nth-child(3) {

    top: 53%;

    opacity: .35;

    animation-delay: -4s;

}

.onda:nth-child(4) {

    top: 72%;

    opacity: .25;

    animation-delay: -1s;

}

@keyframes moverAgua {

    from {

        transform:
            translateX(-5%)
            scaleX(.98);

    }

    to {

        transform:
            translateX(5%)
            scaleX(1.03);

    }

}


/* ==================================================
   ESTRELLAS INTERACTIVAS
================================================== */

.estrellas-mensaje {

    position: absolute;

    inset: 0;

    z-index: 30;

    pointer-events: none;

}

.estrella-mensaje {

    position: absolute;

    width: 25px;
    height: 25px;

    border: none;

    background: transparent;

    cursor: pointer;

    pointer-events: auto;

    opacity: 0;

    transform:
        scale(.4)
        rotate(0deg);

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;

    display: flex;

    align-items: center;
    justify-content: center;

}

.estrella-mensaje::before {

    content: "✦";

    color:
        rgba(255,240,190,.95);

    font-size: 24px;

    text-shadow:
        0 0 5px rgba(255,220,140,.95),
        0 0 14px rgba(255,190,90,.75),
        0 0 25px rgba(255,170,70,.35);

    animation:
        estrellaFlota
        3s ease-in-out
        infinite alternate;

}

@keyframes estrellaFlota {

    from {

        transform:
            scale(.8)
            rotate(-8deg);

    }

    to {

        transform:
            scale(1.15)
            rotate(8deg);

    }

}

.estrella-mensaje.visible {

    opacity: 1;

    transform:
        scale(1)
        rotate(0deg);

}

.estrella-mensaje.usada {

    opacity: .18;

    transform:
        scale(.55);

}

.estrella-mensaje.oculta {

    opacity: 0;

    pointer-events: none;

}


/* ==================================================
   MENSAJE
================================================== */

.mensaje {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -45%)
        scale(.94);

    width:
        min(620px, 82%);

    padding:
        25px 30px;

    border-radius: 22px;

    background:
        rgba(15,18,38,.38);

    border:
        1px solid
        rgba(255,230,190,.18);

    backdrop-filter:
        blur(12px);

    color:
        rgba(255,248,238,.94);

    text-align: center;

    font-size:
        clamp(16px, 2vw, 20px);

    line-height: 1.65;

    letter-spacing: .2px;

    box-shadow:
        0 15px 50px rgba(0,0,0,.2),
        0 0 35px rgba(255,190,120,.06);

    opacity: 0;

    visibility: hidden;

    z-index: 40;

    pointer-events: none;

    transition:
        opacity 1.1s ease,
        transform 1.1s ease;

}

.mensaje.visible {

    opacity: 1;

    visibility: visible;

    transform:
        translate(-50%, -50%)
        scale(1);

}


/* ==================================================
   PANTALLA INICIAL
================================================== */

.inicio {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    z-index: 50;

    padding: 25px;

    transition:
        opacity 2s ease,
        visibility 2s ease;

}

.inicio.oculto {

    opacity: 0;

    visibility: hidden;

}


/* ==================================================
   TÍTULO
================================================== */

.titulo {

    color:
        #eef2ff;

    font-size:
        clamp(35px, 6vw, 70px);

    font-weight:
        normal;

    letter-spacing:
        1px;

    text-shadow:
        0 0 12px rgba(180,200,255,.45),
        0 0 30px rgba(90,120,190,.25);

    margin-bottom:
        18px;

}


/* ==================================================
   SUBTÍTULO
================================================== */

.subtitulo {

    color:
        rgba(225,232,250,.82);

    font-size:
        17px;

    letter-spacing:
        .5px;

    margin-bottom:
        34px;

}


/* ==================================================
   BOTÓN
================================================== */

.boton {

    padding:
        14px 38px;

    border-radius:
        40px;

    border:
        1px solid
        rgba(220,230,255,.4);

    background:
        rgba(20,35,70,.35);

    color:
        rgba(240,245,255,.95);

    font-size:
        17px;

    cursor:
        pointer;

    backdrop-filter:
        blur(10px);

    box-shadow:
        0 0 18px rgba(100,130,200,.18);

    transition:
        transform .3s ease,
        background .3s ease,
        box-shadow .3s ease;

}

.boton:hover {

    transform:
        scale(1.06);

    background:
        rgba(60,80,130,.35);

    box-shadow:
        0 0 28px rgba(130,160,230,.3);

}


/* ==================================================
   RESPONSIVE
================================================== */

@media (max-width: 600px) {

    .titulo {

        font-size:
            clamp(32px, 10vw, 48px);

    }

    .subtitulo {

        font-size: 15px;

    }

    .boton {

        padding:
            13px 30px;

    }

    .mensaje {

        width: 84%;

        padding:
            21px 22px;

        font-size: 16px;

    }

    .estrella-mensaje {

        width: 30px;
        height: 30px;

    }

    .estrella-mensaje::before {

        font-size: 23px;

    }

}


/* ==================================================
   FINAL
================================================== */

.final {

    opacity: .18;

}

</style>

</head>

const textoMensaje =
    document.getElementById(
        "textoMensaje"
    );

const estrellasMensaje =
    document.querySelectorAll(
        ".estrella-mensaje"
    );


let estrellaActual = 0;


/* ==================================================
   COMENZAR EL VIAJE
================================================== */

function comenzar() {

    inicio.classList.add(
        "oculto"
    );

    setTimeout(() => {

        escena.classList.add(
            "iniciado"
        );

    }, 150);

    setTimeout(() => {

        estrellasMensaje[0]
            .classList.add(
                "visible"
            );

    }, 2200);

}


/* ==================================================
   MOSTRAR MENSAJE
================================================== */

function mostrarMensaje(
    estrella
) {

    const texto =
        estrella.dataset.mensaje;

    textoMensaje.innerText =
        texto;

    mensaje.classList.remove(
        "visible"
    );

    setTimeout(() => {

        mensaje.classList.add(
            "visible"
        );

    }, 80);

    estrella.classList.add(
        "usada"
    );

}


/* ==================================================
   TOCAR ESTRELLA
================================================== */

estrellasMensaje.forEach(
    (estrella, indice) => {

        estrella.addEventListener(
            "click",
            () => {

                mostrarMensaje(
                    estrella
                );

                estrellaActual =
                    indice;

                /*
                    Después de un pequeño
                    momento aparece la siguiente
                    estrella.
                */

                setTimeout(() => {

                    if (
                        indice + 1 <
                        estrellasMensaje.length
                    ) {

                        estrellasMensaje[
                            indice + 1
                        ].classList.add(
                            "visible"
                        );

                    }

                }, 1700);

            }
        );

    }
);


/* ==================================================
   TOCAR EL MENSAJE PARA CERRARLO
================================================== */

mensaje.addEventListener(
    "click",
    () => {

        mensaje.classList.remove(
            "visible"
        );

    }
);

</script>

</body>

</html>
