<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Para Tu 🌙</title>


<style>

/* ==================================================
   CONFIGURACIÓN GENERAL
================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Georgia, serif;
}

body {

    background: #050b18;
}


/* ==================================================
   ESCENARIO PRINCIPAL
================================================== */

.escena {

    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;

    /*
       ESTE SIGUE SIENDO EL FONDO ORIGINAL
       DE LA PANTALLA DE INICIO
    */

    background-image:
        url("bosque-noche.jpg");

    background-size: cover;

    background-position: center;

    background-color: #050b18;
}


/* ==================================================
   PAISAJE MÁGICO
   APARECE SOLAMENTE DESPUÉS DE "EMPEZAR"
================================================== */

.escena::before {

    content: "";

    position: absolute;

    inset: 0;

    /*
       ESTA ES LA IMAGEN QUE GENERAMOS
    */

    background-image:
        url("paisaje.png");

    background-size: cover;

    background-position: center;

    opacity: 0;

    transform:
        scale(1.04);

    z-index: 1;

    pointer-events: none;

    transition:

        opacity 2.4s ease,

        transform 5s ease;
}


/*
   CUANDO SE PRESIONA "EMPEZAR"
*/

.escena.iniciado::before {

    opacity: 1;

    transform:
        scale(1);
}


/* ==================================================
   OSCURIDAD DE LA PANTALLA INICIAL
================================================== */

.oscuridad {

    position: absolute;

    inset: 0;

    background:

        linear-gradient(

            to bottom,

            rgba(2, 8, 25, 0.48),

            rgba(4, 12, 30, 0.28),

            rgba(2, 8, 20, 0.55)

        );

    pointer-events: none;

    z-index: 2;

    transition:

        opacity 1.8s ease;
}


/*
   AL COMENZAR, QUITAMOS ESTA CAPA
   PARA QUE EL PAISAJE SE VEA LIMPIO
*/

.escena.iniciado .oscuridad {

    opacity: 0;
}


/* ==================================================
   LUZ DE LUNA ORIGINAL
================================================== */

.luz-luna {

    position: absolute;

    width: 500px;
    height: 500px;

    top: -180px;
    left: 0;

    border-radius: 50%;

    background:

        radial-gradient(

            circle,

            rgba(160,185,255,0.13) 0%,

            rgba(100,130,210,0.07) 35%,

            transparent 70%

        );

    pointer-events: none;

    z-index: 3;

    transition:

        opacity 1.8s ease,

        transform 1.8s ease;
}


/*
   LA LUZ DE LUNA DESAPARECE
   CUANDO ENTRA EL NUEVO PAISAJE
*/

.escena.iniciado .luz-luna {

    opacity: 0;
}


/* ==================================================
   ESTRELLAS DE LA PANTALLA INICIAL
================================================== */

.estrellas {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 4;

    transition:

        opacity 1.8s ease;
}


/*
   LAS ESTRELLAS SE VAN SUAVEMENTE
*/

.escena.iniciado .estrellas {

    opacity: 0;
}


.estrella {

    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background:
        rgba(220,230,255,0.85);

    box-shadow:

        0 0 5px
        rgba(190,215,255,0.7);

    animation:

        brillar
        4s
        infinite
        alternate
        ease-in-out;
}


@keyframes brillar {

    from {

        opacity: 0.25;

        transform:
            scale(0.7);
    }

    to {

        opacity: 0.9;

        transform:
            scale(1.3);
    }
}


/* ==================================================
   NIEBLA DE LA PANTALLA INICIAL
================================================== */

.niebla {

    position: absolute;

    width: 120%;
    height: 35%;

    left: -10%;
    bottom: -5%;

    background:

        radial-gradient(

            ellipse at center,

            rgba(180,200,230,0.13),

            transparent 68%

        );

    filter:
        blur(30px);

    pointer-events: none;

    z-index: 5;

    animation:

        moverNiebla
        18s
        infinite
        alternate
        ease-in-out;

    transition:

        opacity 1.8s ease;
}


/*
   QUITAMOS LA NIEBLA DEL PAISAJE NUEVO
*/

.escena.iniciado .niebla {

    opacity: 0;
}


@keyframes moverNiebla {

    from {

        transform:
            translateX(-2%);
    }

    to {

        transform:
            translateX(2%);
    }
}


/* ==================================================
   BRILLO DEL SOL
   MUY SUAVE Y EN MOVIMIENTO
================================================== */

.escena::after {

    content: "";

    position: absolute;

    width: 520px;
    height: 520px;

    /*
       POSICIÓN APROXIMADA DEL SOL
       EN NUESTRA IMAGEN
    */

    left: 65%;
    top: 55%;

    transform:

        translate(-50%, -50%)
        scale(.82);

    border-radius: 50%;

    background:

        radial-gradient(

            circle,

            rgba(255,215,145,0.20) 0%,

            rgba(255,175,120,0.10) 30%,

            rgba(255,140,100,0) 70%

        );

    opacity: 0;

    pointer-events: none;

    z-index: 8;

    transition:

        opacity 2s ease;
}


/*
   CUANDO APARECE EL PAISAJE,
   EL BRILLO COMIENZA A RESPIRAR
*/

.escena.iniciado::after {

    opacity: 1;

    animation:

        brilloSol
        5s
        ease-in-out
        infinite;
}


@keyframes brilloSol {

    0%,
    100% {

        transform:

            translate(-50%, -50%)
            scale(.82);
    }

    50% {

        transform:

            translate(-50%, -50%)
            scale(1.04);
    }
}


/* ==================================================
   LUCIÉRNAGAS
================================================== */

.luciernagas {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 9;

    opacity: 0;

    transition:

        opacity 2s ease;
}


/*
   APARECEN CON EL PAISAJE
*/

.escena.iniciado .luciernagas {

    opacity: 1;
}


.luz {

    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background:

        rgba(255,225,135,0.95);

    box-shadow:

        0 0 8px
        rgba(255,220,120,0.85),

        0 0 18px
        rgba(255,185,90,0.45);

    animation:

        luciernaga
        4s
        ease-in-out
        infinite;
}


@keyframes luciernaga {

    0% {

        transform:

            translate(0, 0)
            scale(.7);

        opacity: .25;
    }

    25% {

        transform:

            translate(12px, -18px)
            scale(1);

        opacity: 1;
    }

    50% {

        transform:

            translate(-8px, -35px)
            scale(.85);

        opacity: .65;
    }

    75% {

        transform:

            translate(15px, -15px)
            scale(1.1);

        opacity: 1;
    }

    100% {

        transform:

            translate(0, 0)
            scale(.7);

        opacity: .25;
    }
}


/*
   VARIACIONES PARA QUE NO SE MUEVAN TODAS IGUAL
*/

.luz:nth-child(2) {

    animation-duration:
        5.5s;
}


.luz:nth-child(3) {

    animation-duration:
        4.7s;

    animation-delay:
        -1.5s;
}


.luz:nth-child(4) {

    animation-duration:
        6s;

    animation-delay:
        -2s;
}


.luz:nth-child(5) {

    animation-duration:
        5s;

    animation-delay:
        -3s;
}


.luz:nth-child(6) {

    animation-duration:
        6.5s;

    animation-delay:
        -1s;
}


/* ==================================================
   PANTALLA DE INICIO
   CONSERVADA DE TU VERSIÓN ORIGINAL
================================================== */

.inicio {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    z-index: 20;

    padding: 25px;

    transition:

        opacity 2s ease,

        visibility 2s ease;
}


.inicio.oculto {

    opacity: 0;

    visibility: hidden;
}


/* ==================================================
   TÍTULO
================================================== */

.titulo {

    color:
        #eef2ff;

    font-size:
        clamp(35px, 6vw, 70px);

    font-weight:
        normal;

    letter-spacing:
        1px;

    text-shadow:

        0 0 12px
        rgba(180,200,255,0.45),

        0 0 30px
        rgba(90,120,190,0.25);

    margin-bottom:
        18px;
}


/* ==================================================
   SUBTÍTULO
================================================== */

.subtitulo {

    color:
        rgba(225,232,250,0.82);

    font-size:
        17px;

    letter-spacing:
        .5px;

    margin-bottom:
        34px;
}


/* ==================================================
   BOTÓN
================================================== */

.boton {

    padding:
        14px 38px;

    border-radius:
        40px;

    border:
        1px solid
        rgba(220,230,255,0.4);

    background:
        rgba(20,35,70,0.35);

    color:
        rgba(240,245,255,0.95);

    font-size:
        17px;

    cursor:
        pointer;

    backdrop-filter:
        blur(10px);

    box-shadow:

        0 0 18px
        rgba(100,130,200,0.18);

    transition:

        transform .3s ease,

        background .3s ease,

        box-shadow .3s ease;
}


.boton:hover {

    transform:
        scale(1.06);

    background:
        rgba(60,80,130,0.35);

    box-shadow:

        0 0 28px
        rgba(130,160,230,0.3);
}


/* ==================================================
   MENSAJES
================================================== */

.mensaje {

    position: absolute;

    left: 50%;

    bottom: 10%;

    transform:

        translate(-50%, 30px);

    width:

        min(600px, 85%);

    padding:

        24px 30px;

    border-radius:
        20px;

    background:

        rgba(5,12,28,0.48);

    border:

        1px solid
        rgba(220,230,255,0.16);

    backdrop-filter:

        blur(12px);

    color:

        rgba(245,247,255,0.92);

    text-align:
        center;

    font-size:
        17px;

    line-height:
        1.6;

    box-shadow:

        0 15px 50px
        rgba(0,0,0,0.25);

    opacity:
        0;

    z-index:
        15;

    transition:

        opacity 1.4s ease,

        transform 1.4s ease;

    cursor:
        pointer;
}


.mensaje.visible {

    opacity:
        1;

    transform:

        translate(-50%, 0);
}


/* ==================================================
   ADAPTACIÓN PARA CELULAR
================================================== */

@media (max-width: 600px) {

    .titulo {

        font-size:
            clamp(32px, 10vw, 48px);
    }

    .subtitulo {

        font-size:
            15px;
    }

    .mensaje {

        bottom:
            7%;

        width:
            88%;

        padding:
            20px 22px;

        font-size:
            15px;
    }

    .escena::after {

        width:
            380px;

        height:
            380px;

        left:
            62%;

        top:
            52%;
    }
}

</style>

</head>


<body>


<div
    class="escena"
    id="escena"
>


    <!-- ==================================================
         ELEMENTOS DE LA PANTALLA INICIAL
    ================================================== -->


    <div
        class="oscuridad"
    ></div>


    <div
        class="luz-luna"
    ></div>


    <!-- ESTRELLAS -->

    <div
        class="estrellas"
    >

        <span
            class="estrella"
            style="top:10%;left:27%;"
        ></span>

        <span
            class="estrella"
            style="top:18%;left:40%;"
        ></span>

        <span
            class="estrella"
            style="top:12%;left:54%;"
        ></span>

        <span
            class="estrella"
            style="top:27%;left:68%;"
        ></span>

        <span
            class="estrella"
            style="top:20%;left:82%;"
        ></span>

        <span
            class="estrella"
            style="top:35%;left:15%;"
        ></span>

        <span
            class="estrella"
            style="top:30%;left:57%;"
        ></span>

        <span
            class="estrella"
            style="top:8%;left:90%;"
        ></span>

        <span
            class="estrella"
            style="top:40%;left:38%;"
        ></span>

        <span
            class="estrella"
            style="top:24%;left:6%;"
        ></span>

    </div>


    <!-- NIEBLA -->

    <div
        class="niebla"
    ></div>


    <!-- ==================================================
         LUCIÉRNAGAS
    ================================================== -->

    <div
        class="luciernagas"
    >

        <span
            class="luz"
            style="left:18%;bottom:22%;"
        ></span>

        <span
            class="luz"
            style="left:31%;bottom:15%;"
        ></span>

        <span
            class="luz"
            style="left:45%;bottom:27%;"
        ></span>

        <span
            class="luz"
            style="left:65%;bottom:20%;"
        ></span>

        <span
            class="luz"
            style="left:78%;bottom:30%;"
        ></span>

        <span
            class="luz"
            style="left:87%;bottom:18%;"
        ></span>

    </div>


    <!-- ==================================================
         PANTALLA DE INICIO
    ================================================== -->

    <div
        class="inicio"
        id="inicio"
    >

        <div
            class="titulo"
        >
            Para alguien especial
        </div>


        <div
            class="subtitulo"
        >
            Hay un pequeño viaje esperándote... 🌙
        </div>


        <button
            class="boton"
            onclick="comenzar()"
        >
            Empezar ✦
        </button>

    </div>


    <!-- ==================================================
         MENSAJE
    ================================================== -->

    <div
        class="mensaje"
        id="mensaje"
    >

        <p
            id="textoMensaje"
        ></p>

    </div>


</div>


<script>


/* ==================================================
   VARIABLES
================================================== */

let paso = 0;


const escena =
    document.getElementById(
        "escena"
    );


const inicio =
    document.getElementById(
        "inicio"
    );


const mensaje =
    document.getElementById(
        "mensaje"
    );


const textoMensaje =
    document.getElementById(
        "textoMensaje"
    );


/* ==================================================
   MENSAJES
================================================== */

const mensajes = [

    "Quería hacerte una pequeña cosa... simplemente porque pensé en ti.",

    "Hay momentos pequeños contigo que recuerdo y que me hacen sonreír.",

    "Gracias por escucharme y por preguntarme cómo estoy.",

    "Admiro que, incluso cuando las cosas se ponen difíciles, sigas intentando avanzar.",

    "Y sí... seguiré diciéndote nuv y viejito cuando te quejes de algo. 🥺",

    "Hay una última cosa que quiero decirte..."

];


/* ==================================================
   COMENZAR
================================================== */

function comenzar() {


    /*
       OCULTAMOS LA PANTALLA INICIAL
    */

    inicio.classList.add(
        "oculto"
    );


    /*
       COMIENZA A APARECER EL PAISAJE
    */

    setTimeout(() => {

        escena.classList.add(
            "iniciado"
        );

    }, 200);


    /*
       DESPUÉS DE LA TRANSICIÓN
       APARECE EL PRIMER MENSAJE
    */

    setTimeout(() => {

        mostrarMensaje();

    }, 2200);

}


/* ==================================================
   MOSTRAR MENSAJE
================================================== */

function mostrarMensaje() {


    if (
        paso >= mensajes.length
    ) {

        return;

    }


    /*
       CAMBIAMOS EL TEXTO
    */

    textoMensaje.innerText =
        mensajes[paso];


    /*
       LO OCULTAMOS UN MOMENTO
       PARA QUE CADA MENSAJE
       ENTRE SUAVEMENTE
    */

    mensaje.classList.remove(
        "visible"
    );


    setTimeout(() => {

        mensaje.classList.add(
            "visible"
        );

    }, 180);


    paso++;

}


/* ==================================================
   TOCAR EL MENSAJE
   PARA CONTINUAR
================================================== */

mensaje.addEventListener(

    "click",

    mostrarMensaje

);


</script>


</body>

</html>
