<title>Para alguien especial 🌙</title>

<style>

/* ==================================================
   BASE
================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Georgia, serif;
}

body {
    background: #050b18;
}


/* ==================================================
   ESCENA
================================================== */

.escena {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;

    background-image: url("bosque-noche.jpg");
    background-size: cover;
    background-position: center;

    background-color: #050b18;
}


/* ==================================================
   PAISAJE DEL ATARDECER
================================================== */

.escena::before {

    content: "";

    position: absolute;
    inset: 0;

    background-image: url("paisaje.png");

    background-size: cover;
    background-position: center;

    opacity: 0;

    transform: scale(1.04);

    z-index: 1;

    pointer-events: none;

    transition:
        opacity 3s ease,
        transform 8s ease;

}

.escena.iniciado::before {

    opacity: 1;

    transform: scale(1);

}


/* ==================================================
   OSCURIDAD SUAVE
================================================== */

.oscuridad {

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(5,10,25,.25),
            rgba(10,10,25,.08),
            rgba(5,8,20,.22)
        );

    z-index: 2;

    pointer-events: none;

    transition:
        opacity 3s ease;

}

.escena.iniciado .oscuridad {

    opacity: .35;

}


/* ==================================================
   LUZ DEL SOL
================================================== */

.escena::after {

    content: "";

    position: absolute;

    width: 58vw;
    height: 58vw;

    max-width: 700px;
    max-height: 700px;

    left: 47%;
    top: 38%;

    transform:
        translate(-50%, -50%)
        scale(.92);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,220,155,.18) 0%,
            rgba(255,190,120,.10) 24%,
            rgba(255,160,100,.05) 45%,
            transparent 72%
        );

    opacity: 0;

    z-index: 3;

    pointer-events: none;

    mix-blend-mode: screen;

}

.escena.iniciado::after {

    opacity: 1;

    animation:
        brilloSol 6s ease-in-out infinite;

}

@keyframes brilloSol {

    0% {
        opacity: .55;
        transform:
            translate(-50%, -50%)
            scale(.92);
    }

    50% {
        opacity: .85;
        transform:
            translate(-50%, -50%)
            scale(1.04);
    }

    100% {
        opacity: .55;
        transform:
            translate(-50%, -50%)
            scale(.92);
    }

}


/* ==================================================
   DESTELLOS DEL SOL
================================================== */

.destellos-sol {

    position: absolute;

    inset: 0;

    z-index: 6;

    pointer-events: none;

    opacity: 0;

    transition:
        opacity 3s ease;

}

.escena.iniciado .destellos-sol {

    opacity: 1;

}

.destello {

    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background:
        rgba(255,240,190,.95);

    box-shadow:
        0 0 5px rgba(255,235,170,.95),
        0 0 14px rgba(255,205,120,.75),
        0 0 28px rgba(255,180,90,.35);

    animation:
        destelloSol
        var(--duracion)
        ease-in-out
        infinite;

    animation-delay:
        var(--delay);

}

@keyframes destelloSol {

    0%,
    100% {

        opacity: 0;

        transform:
            scale(.35)
            translate(0, 4px);

    }

    35% {

        opacity: .35;

        transform:
            scale(.7)
            translate(2px, 0);

    }

    50% {

        opacity: 1;

        transform:
            scale(1.25)
            translate(0, -2px);

    }

    65% {

        opacity: .4;

        transform:
            scale(.7)
            translate(-2px, 0);

    }

}


/* ==================================================
   ESTRELLAS DEL CIELO
================================================== */

.estrellas {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 4;

    opacity: 1;

}

.estrella {

    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background:
        rgba(235,240,255,.8);

    box-shadow:
        0 0 5px rgba(210,225,255,.65);

    animation:
        brillar
        4s
        infinite alternate ease-in-out;

}

@keyframes brillar {

    from {

        opacity: .2;

        transform:
            scale(.7);

    }

    to {

        opacity: .8;

        transform:
            scale(1.3);

    }

}


/* ==================================================
   NIEBLA
================================================== */

.niebla {

    position: absolute;

    width: 125%;
    height: 35%;

    left: -12%;
    bottom: -5%;

    background:

        radial-gradient(
            ellipse at center,
            rgba(220,210,220,.10),
            transparent 68%
        );

    filter:
        blur(30px);

    pointer-events: none;

    z-index: 5;

    opacity: .7;

    animation:
        moverNiebla
        18s
        infinite
        alternate
        ease-in-out;

}

@keyframes moverNiebla {

    from {

        transform:
            translateX(-3%);

    }

    to {

        transform:
            translateX(3%);

    }

}


/* ==================================================
   LUCIÉRNAGAS
================================================== */

.luciernagas {

    position: absolute;

    inset: 0;

    z-index: 10;

    pointer-events: none;

    opacity: 0;

    transition:
        opacity 3s ease;

}

.escena.iniciado .luciernagas {

    opacity: 1;

}

.luz {

    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background:
        rgba(255,235,145,.95);

    box-shadow:

        0 0 6px rgba(255,235,145,.9),

        0 0 16px rgba(255,205,100,.65),

        0 0 28px rgba(255,185,80,.3);

    animation:
        luciernaga
        var(--duracion,5s)
        ease-in-out
        infinite
        alternate;

}

@keyframes luciernaga {

    0% {

        opacity: .2;

        transform:
            translate(
                0,
                8px
            )
            scale(.7);

    }

    50% {

        opacity: .9;

        transform:
            translate(
                8px,
                -10px
            )
            scale(1);

    }

    100% {

        opacity: .35;

        transform:
            translate(
                -5px,
                -22px
            )
            scale(.75);

    }

}


/* ==================================================
   HOJAS
================================================== */

.hojas {

    position: absolute;

    inset: 0;

    z-index: 12;

    pointer-events: none;

    opacity: 0;

    transition:
        opacity 3s ease;

}

.escena.iniciado .hojas {

    opacity: 1;

}

.hoja {

    position: absolute;

    top: -35px;

    width: 10px;
    height: 6px;

    border-radius:
        100% 0 100% 0;

    background:
        rgba(205,145,90,.78);

    box-shadow:
        0 0 3px rgba(180,120,70,.25);

    animation:

        caerHoja
        var(--duracion)
        linear
        infinite;

    animation-delay:
        var(--delay);

}

@keyframes caerHoja {

    0% {

        transform:
            translate3d(
                0,
                -40px,
                0
            )
            rotate(0deg);

        opacity: 0;

    }

    8% {

        opacity: .85;

    }

    25% {

        transform:
            translate3d(
                25px,
                25vh,
                0
            )
            rotate(110deg);

    }

    50% {

        transform:
            translate3d(
                -20px,
                50vh,
                0
            )
            rotate(220deg);

    }

    75% {

        transform:
            translate3d(
                35px,
                75vh,
                0
            )
            rotate(300deg);

    }

    92% {

        opacity: .65;

    }

    100% {

        transform:
            translate3d(
                -10px,
                115vh,
                0
            )
            rotate(420deg);

        opacity: 0;

    }

}


/* ==================================================
   AGUA
================================================== */

.agua {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 44%;

    z-index: 8;

    pointer-events: none;

    opacity: 0;

    overflow: hidden;

    transition:
        opacity 3s ease;

}

.escena.iniciado .agua {

    opacity: 1;

}


/* Movimiento general de reflejos */

.agua::before {

    content: "";

    position: absolute;

    inset: -10%;

    background:

        repeating-linear-gradient(
            176deg,
            transparent 0px,
            transparent 18px,
            rgba(255,230,205,.07) 19px,
            transparent 21px,
            transparent 42px
        );

    opacity: .55;

    transform:
        translateX(-3%);

    animation:
        reflejoAgua
        9s
        ease-in-out
        infinite
        alternate;

}

@keyframes reflejoAgua {

    0% {

        transform:
            translateX(-5%)
            translateY(0);

    }

    50% {

        transform:
            translateX(2%)
            translateY(5px);

    }

    100% {

        transform:
            translateX(-2%)
            translateY(-3px);

    }

}


/* Ondas */

.onda {

    position: absolute;

    left: -25%;

    width: 150%;

    height: 90px;

    border-top:
        1px solid
        rgba(255,225,205,.09);

    border-radius: 50%;

    filter:
        blur(.35px);

    animation:
        moverAgua
        var(--duracion)
        ease-in-out
        infinite
        alternate;

    animation-delay:
        var(--delay);

}

@keyframes moverAgua {

    0% {

        transform:
            translateX(-3%)
            scaleX(.98);

        opacity: .25;

    }

    50% {

        transform:
            translateX(3%)
            scaleX(1.02);

        opacity: .65;

    }

    100% {

        transform:
            translateX(-2%)
            scaleX(.99);

        opacity: .3;

    }

}


/* ==================================================
   PANTALLA DE INICIO
================================================== */

.inicio {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    z-index: 50;

    padding: 20px;

    background:
        rgba(2,7,20,.18);

    transition:
        opacity 2s ease,
        visibility 2s ease;

}

.inicio.oculto {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

}

.titulo {

    color:
        rgba(255,248,238,.96);

    font-size:
        clamp(30px,5vw,58px);

    letter-spacing:
        1px;

    text-shadow:

        0 0 10px rgba(255,220,180,.35),

        0 5px 30px rgba(0,0,0,.5);

    margin-bottom: 15px;

}

.subtitulo {

    color:
        rgba(240,235,230,.86);

    font-size:
        clamp(15px,2vw,21px);

    margin-bottom: 30px;

}

.boton {

    padding:
        13px 28px;

    border:
        1px solid
        rgba(255,235,205,.3);

    border-radius:
        30px;

    background:
        rgba(255,240,220,.08);

    color:
        rgba(255,248,238,.95);

    font-family:
        Georgia, serif;

    font-size:
        16px;

    cursor:
        pointer;

    backdrop-filter:
        blur(8px);

    box-shadow:
        0 5px 30px rgba(0,0,0,.25);

    transition:
        all .4s ease;

}

.boton:hover {

    background:
        rgba(255,240,220,.16);

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 35px rgba(255,210,160,.12);

}


/* ==================================================
   ESTRELLAS DE MENSAJES
================================================== */

.estrellas-mensaje {

    position: absolute;

    inset: 0;

    z-index: 30;

    pointer-events: none;

    opacity: 0;

    transition:
        opacity 3s ease;

}

.escena.iniciado .estrellas-mensaje {

    opacity: 1;

}

.estrella-mensaje {

    position: absolute;

    width: 28px;
    height: 28px;

    border: none;

    background:
        transparent;

    cursor:
        pointer;

    pointer-events:
        auto;

    opacity: 0;

    transform:
        scale(.35)
        rotate(-20deg);

    transition:

        opacity 2.4s ease,

        transform 2.8s
        cubic-bezier(.22,1,.36,1);

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

}

.estrella-mensaje::before {

    content:
        "✦";

    color:
        rgba(255,242,200,.95);

    font-size:
        25px;

    text-shadow:

        0 0 5px
        rgba(255,225,150,.95),

        0 0 13px
        rgba(255,195,100,.75),

        0 0 27px
        rgba(255,175,80,.35);

    animation:
        estrellaFlota
        4s
        ease-in-out
        infinite
        alternate;

}

@keyframes estrellaFlota {

    0% {

        transform:
            translateY(2px)
            scale(.9);

        opacity:
            .65;

    }

    100% {

        transform:
            translateY(-3px)
            scale(1.12);

        opacity:
            1;

    }

}

.estrella-mensaje.visible {

    opacity: 1;

    transform:
        scale(1)
        rotate(0deg);

}

.estrella-mensaje.usada {

    opacity: .28;

    transform:
        scale(.65)
        rotate(8deg);

    transition:
        opacity 3s ease,
        transform 3s ease;

}


/* ==================================================
   MENSAJE
================================================== */

.mensaje {

    position: absolute;

    left: 50%;
    top: 50%;

    width:
        min(620px,82%);

    padding:
        25px 30px;

    border-radius:
        22px;

    background:
        rgba(15,18,38,.32);

    border:
        1px solid
        rgba(255,230,190,.13);

    backdrop-filter:
        blur(12px);

    color:
        rgba(255,248,238,.94);

    text-align:
        center;

    font-size:
        clamp(16px,2vw,20px);

    line-height:
        1.65;

    letter-spacing:
        .2px;

    box-shadow:

        0 15px 50px
        rgba(0,0,0,.18),

        0 0 35px
        rgba(255,190,120,.05);

    opacity:
        0;

    visibility:
        hidden;

    z-index:
        40;

    pointer-events:
        none;

    transform:
        translate(-50%,-47%)
        scale(.96);

    filter:
        blur(2px);

    transition:

        opacity 2.2s ease,

        transform 2.4s
        cubic-bezier(.22,1,.36,1),

        filter 2.2s ease;

}

.mensaje.visible {

    opacity:
        1;

    visibility:
        visible;

    transform:
        translate(-50%,-50%)
        scale(1);

    filter:
        blur(0);

}


/* ==================================================
   PEQUEÑO BRILLO ALREDEDOR DEL MENSAJE
================================================== */

.mensaje::before {

    content: "";

    position: absolute;

    inset: -30px;

    border-radius:
        35px;

    background:
        radial-gradient(
            ellipse,
            rgba(255,210,150,.06),
            transparent 65%
        );

    z-index: -1;

    pointer-events: none;

}


/* ==================================================
   ADAPTACIÓN PARA CELULAR
================================================== */

@media (max-width: 600px) {

    .mensaje {

        width: 86%;

        padding:
            21px 22px;

        font-size:
            16px;

    }

    .hoja {

        width: 8px;
        height: 5px;

    }

}


/* ==================================================
   ANIMACIÓN SUAVE DEL PAISAJE
================================================== */

.escena.iniciado {

    animation:
        respiracionEscena
        14s
        ease-in-out
        infinite
        alternate;

}

@keyframes respiracionEscena {

    from {

        background-position:
            center;

    }

    to {

        background-position:
            50.5% 49.5%;

    }

}

</style>
</head>

<script>

/* ==================================================
   ELEMENTOS
================================================== */

const escena =
    document.getElementById(
        "escena"
    );

const inicio =
    document.getElementById(
        "inicio"
    );

const mensaje =
    document.getElementById(
        "mensaje"
    );

const textoMensaje =
    document.getElementById(
        "textoMensaje"
    );

const estrellasMensaje =
    document.querySelectorAll(
        ".estrella-mensaje"
    );


/* ==================================================
   CONTROL DE ESTRELLAS
================================================== */

let estrellaActual = 0;


/* ==================================================
   COMENZAR
================================================== */

function comenzar() {

    inicio.classList.add(
        "oculto"
    );


    setTimeout(() => {

        escena.classList.add(
            "iniciado"
        );

    }, 150);


    /* Primera estrella */

    setTimeout(() => {

        if (
            estrellasMensaje.length > 0
        ) {

            estrellasMensaje[0]
                .classList.add(
                    "visible"
                );

        }

    }, 2600);

}


/* ==================================================
   MOSTRAR MENSAJE
================================================== */

function mostrarMensaje(
    estrella
) {

    const texto =
        estrella.dataset.mensaje;


    /*
       Primero hacemos desaparecer
       suavemente el texto anterior.
    */

    mensaje.classList.remove(
        "visible"
    );


    setTimeout(() => {

        textoMensaje.innerText =
            texto;

        mensaje.classList.add(
            "visible"
        );

    }, 850);


    /*
       La estrella que ya usamos
       queda muy tenue.
    */

    estrella.classList.add(
        "usada"
    );

}


/* ==================================================
   CLIC EN LAS ESTRELLAS
================================================== */

estrellasMensaje.forEach(
    (
        estrella,
        indice
    ) => {

        estrella.addEventListener(
            "click",
            () => {

                mostrarMensaje(
                    estrella
                );


                estrellaActual =
                    indice;


                /*
                   La siguiente estrella
                   aparece MUY suavemente.
                */

                setTimeout(() => {

                    if (
                        indice + 1 <
                        estrellasMensaje.length
                    ) {

                        estrellasMensaje[
                            indice + 1
                        ].classList.add(
                            "visible"
                        );

                    }

                }, 3600);

            }
        );

    }
);


/* ==================================================
   CERRAR MENSAJE SUAVEMENTE
================================================== */

mensaje.addEventListener(
    "click",
    () => {

        mensaje.classList.remove(
            "visible"
        );

    }
);

</script>
