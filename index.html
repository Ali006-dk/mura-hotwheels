<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Mura 🌙</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Georgia, serif;
}

/* =====================================
   ESCENARIO
===================================== */

.escena {

    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;

    background-image:
        linear-gradient(
            rgba(5, 15, 45, 0.25),
            rgba(5, 15, 45, 0.35)
        ),
        url("bosque-noche.jpg");

    background-size: cover;
    background-position: center;

    transition:
        filter 8s ease,
        background-color 8s ease;

}


/* =====================================
   CAPA DE COLOR DEL CIELO
===================================== */

.cielo {

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:

        linear-gradient(
            to bottom,
            rgba(8, 18, 60, 0.60),
            rgba(20, 40, 90, 0.25),
            rgba(10, 20, 45, 0.35)
        );

    transition:
        background 8s ease;

}


/* =====================================
   LUNA
===================================== */

.luna {

    position: absolute;

    top: 9%;
    left: 12%;

    width: 120px;
    height: 120px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle at 35% 35%,
            #ffffff 0%,
            #f7f3dc 45%,
            #d8d1ad 75%,
            #a8a27f 100%
        );

    box-shadow:

        0 0 25px rgba(255,255,220,.7),
        0 0 70px rgba(200,220,255,.4),
        0 0 130px rgba(170,200,255,.2);

    transition:

        opacity 8s ease,
        transform 8s ease,
        filter 8s ease;

}


/* =====================================
   ESTRELLAS
===================================== */

.estrellas {

    position: absolute;

    inset: 0;

    pointer-events: none;

    transition: opacity 8s ease;

}

.estrella {

    position: absolute;

    width: 3px;
    height: 3px;

    background: white;

    border-radius: 50%;

    box-shadow: 0 0 8px white;

    animation: parpadear 3s infinite alternate;

}

@keyframes parpadear {

    from {
        opacity: .25;
    }

    to {
        opacity: 1;
    }

}


/* =====================================
   LUCES / LUCIÉRNAGAS
===================================== */

.luciernagas {

    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: 0;

    transition: opacity 8s ease;

}

.luz {

    position: absolute;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #fff5a8;

    box-shadow:
        0 0 10px #fff5a8,
        0 0 25px rgba(255,235,120,.7);

    animation:
        flotar 4s infinite ease-in-out alternate;

}

@keyframes flotar {

    from {
        transform: translateY(0);
        opacity: .35;
    }

    to {
        transform: translateY(-25px);
        opacity: 1;
    }

}


/* =====================================
   NIEBLA
===================================== */

.niebla {

    position: absolute;

    left: -10%;
    bottom: 0;

    width: 120%;
    height: 30%;

    background:

        radial-gradient(
            ellipse,
            rgba(220,235,255,.18),
            transparent 70%
        );

    filter: blur(25px);

    opacity: .65;

    animation:
        moverNiebla 15s infinite alternate ease-in-out;

}

@keyframes moverNiebla {

    from {
        transform: translateX(-3%);
    }

    to {
        transform: translateX(3%);
    }

}


/* =====================================
   INTERFAZ DE INICIO
===================================== */

.inicio {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    z-index: 20;

    transition:
        opacity 2s ease,
        visibility 2s ease;

}

.inicio.oculto {

    opacity: 0;

    visibility: hidden;

}


/* =====================================
   TITULO
===================================== */

.titulo {

    color: white;

    font-size: clamp(
        35px,
        6vw,
        75px
    );

    font-weight: normal;

    text-shadow:

        0 0 15px rgba(255,255,255,.8),
        0 0 40px rgba(160,190,255,.5);

    margin-bottom: 18px;

}


/* =====================================
   SUBTITULO
===================================== */

.subtitulo {

    color: rgba(255,255,255,.9);

    font-size: 18px;

    letter-spacing: 1px;

    margin-bottom: 35px;

}


/* =====================================
   BOTÓN
===================================== */

.boton {

    padding: 15px 40px;

    border-radius: 40px;

    border: 1px solid rgba(255,255,255,.65);

    background:

        rgba(255,255,255,.10);

    color: white;

    font-size: 18px;

    cursor: pointer;

    backdrop-filter: blur(8px);

    box-shadow:

        0 0 20px rgba(170,210,255,.25);

    transition:

        transform .3s ease,
        background .3s ease,
        box-shadow .3s ease;

}

.boton:hover {

    transform: scale(1.08);

    background:

        rgba(255,255,255,.18);

    box-shadow:

        0 0 35px rgba(190,220,255,.45);

}


/* =====================================
   MENSAJES
===================================== */

.mensaje {

    position: absolute;

    left: 50%;
    bottom: 12%;

    transform:
        translateX(-50%)
        translateY(30px);

    width: min(
        600px,
        85%
    );

    padding: 25px 30px;

    text-align: center;

    color: white;

    background:

        rgba(10,20,45,.38);

    border:

        1px solid rgba(255,255,255,.2);

    border-radius: 20px;

    backdrop-filter: blur(12px);

    box-shadow:

        0 10px 50px rgba(0,0,0,.25);

    opacity: 0;

    transition:

        opacity 1.5s ease,
        transform 1.5s ease;

    z-index: 10;

}

.mensaje.visible {

    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);

}


/* =====================================
   CAMBIO NOCHE → ATARDECER
===================================== */

.escena.atardecer-1 .cielo {

    background:

        linear-gradient(
            to bottom,
            rgba(45,55,110,.45),
            rgba(100,70,120,.25),
            rgba(30,40,70,.25)
        );

}

.escena.atardecer-2 .cielo {

    background:

        linear-gradient(
            to bottom,
            rgba(90,65,120,.40),
            rgba(170,95,120,.25),
            rgba(80,55,80,.20)
        );

}

.escena.atardecer-3 .cielo {

    background:

        linear-gradient(
            to bottom,
            rgba(170,90,115,.35),
            rgba(230,135,105,.30),
            rgba(90,65,75,.15)
        );

}

.escena.atardecer-final .cielo {

    background:

        linear-gradient(
            to bottom,
            rgba(255,145,105,.25),
            rgba(255,180,120,.22),
            rgba(100,75,80,.15)
        );

}


/* =====================================
   LUNA SE VA APAGANDO
===================================== */

.escena.atardecer-2 .luna {

    opacity: .7;

}

.escena.atardecer-3 .luna {

    opacity: .35;

    transform:
        scale(.9);

}

.escena.atardecer-final .luna {

    opacity: 0;

}


/* =====================================
   ESTRELLAS DESAPARECEN
===================================== */

.escena.atardecer-2 .estrellas {

    opacity: .55;

}

.escena.atardecer-3 .estrellas {

    opacity: .25;

}

.escena.atardecer-final .estrellas {

    opacity: 0;

}


/* =====================================
   LUCIÉRNAGAS APARECEN
===================================== */

.escena.atardecer-3 .luciernagas {

    opacity: .5;

}

.escena.atardecer-final .luciernagas {

    opacity: 1;

}

</style>
</head>


<body>


<div class="escena" id="escena">


    <!-- CIELO -->

    <div class="cielo"></div>


    <!-- LUNA -->

    <div class="luna"></div>


    <!-- ESTRELLAS -->

    <div class="estrellas">

        <span class="estrella" style="top:12%;left:30%;"></span>
        <span class="estrella" style="top:18%;left:45%;"></span>
        <span class="estrella" style="top:10%;left:62%;"></span>
        <span class="estrella" style="top:28%;left:72%;"></span>
        <span class="estrella" style="top:20%;left:82%;"></span>
        <span class="estrella" style="top:35%;left:15%;"></span>
        <span class="estrella" style="top:30%;left:55%;"></span>
        <span class="estrella" style="top:8%;left:90%;"></span>
        <span class="estrella" style="top:40%;left:38%;"></span>
        <span class="estrella" style="top:25%;left:5%;"></span>

    </div>


    <!-- NIEBLA -->

    <div class="niebla"></div>


    <!-- LUCIÉRNAGAS -->

    <div class="luciernagas">

        <span class="luz" style="left:18%;bottom:22%;"></span>
        <span class="luz" style="left:30%;bottom:15%;animation-delay:1s;"></span>
        <span class="luz" style="left:45%;bottom:27%;animation-delay:2s;"></span>
        <span class="luz" style="left:65%;bottom:20%;animation-delay:.5s;"></span>
        <span class="luz" style="left:78%;bottom:30%;animation-delay:1.5s;"></span>
        <span class="luz" style="left:87%;bottom:18%;animation-delay:2.5s;"></span>

    </div>


    <!-- INTRO -->

    <div class="inicio" id="inicio">

        <div class="titulo">
            Para alguien especial
        </div>

        <div class="subtitulo">
            Hay un pequeño viaje esperándote... 🌙
        </div>

        <button class="boton" onclick="comenzar()">
            Empezar ✦
        </button>

    </div>


    <!-- MENSAJE -->

    <div class="mensaje" id="mensaje">

        <p id="textoMensaje"></p>

    </div>


</div>


<script>

let paso = 0;

const escena =
    document.getElementById("escena");

const inicio =
    document.getElementById("inicio");

const mensaje =
    document.getElementById("mensaje");

const textoMensaje =
    document.getElementById("textoMensaje");


const mensajes = [

    "Quería hacerte una pequeña cosa... simplemente porque pensé en ti.",

    "Hay momentos pequeños contigo que recuerdo y que me hacen sonreír.",

    "Gracias por escucharme y por preguntarme cómo estoy.",

    "Admiro que, incluso cuando las cosas se ponen difíciles, sigas intentando avanzar.",

    "Y sí... seguiré diciéndote nuv y viejito cuando te quejes de algo. 🥺",

    "Hay una última cosa que quiero decirte..."

];


function comenzar() {

    inicio.classList.add("oculto");

    setTimeout(() => {

        mostrarMensaje();

    }, 1500);

}


function mostrarMensaje() {

    if (paso >= mensajes.length) {

        return;

    }


    textoMensaje.innerText =
        mensajes[paso];


    mensaje.classList.remove("visible");


    setTimeout(() => {

        mensaje.classList.add("visible");

    }, 200);


    cambiarPaisaje(paso);


    paso++;

}


/* =====================================
   CAMBIO DEL PAISAJE
===================================== */

function cambiarPaisaje(numero) {

    escena.classList.remove(
        "atardecer-1",
        "atardecer-2",
        "atardecer-3",
        "atardecer-final"
    );


    if (numero === 1) {

        escena.classList.add(
            "atardecer-1"
        );

    }


    if (numero === 2) {

        escena.classList.add(
            "atardecer-2"
        );

    }


    if (numero === 3) {

        escena.classList.add(
            "atardecer-3"
        );

    }


    if (numero >= 4) {

        escena.classList.add(
            "atardecer-final"
        );

    }

}


/* =====================================
   AVANZAR AL TOCAR EL MENSAJE
===================================== */

mensaje.addEventListener(
    "click",
    mostrarMensaje
);


</script>

</body>
</html>
