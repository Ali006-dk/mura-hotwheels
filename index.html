<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para alguien especial 🌙</title>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
    background: #050914;
}

body {
    color: white;
}


/* =========================================================
   PANTALLA INICIAL
========================================================= */

.inicio {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;

    background:
        linear-gradient(
            to bottom,
            rgba(3, 7, 20, .18),
            rgba(4, 8, 22, .45)
        ),
        url("bosque-noche.jpg") center / cover no-repeat;

    transition:
        opacity 2.2s ease,
        visibility 2.2s ease;
}

.inicio.oculto {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}


/* =========================================================
   CONTENIDO DEL INICIO
========================================================= */

.contenido-inicio {
    position: relative;
    z-index: 8;
    width: min(700px, 90%);
    padding: 30px;
}

.contenido-inicio h1 {
    margin: 0 0 18px;

    font-size: clamp(30px, 6vw, 58px);
    font-weight: normal;
    letter-spacing: 1px;

    color: rgba(255, 248, 235, .96);

    text-shadow:
        0 0 8px rgba(255,255,255,.45),
        0 0 25px rgba(180,200,255,.35),
        0 8px 30px rgba(0,0,0,.45);
}

.contenido-inicio p {
    margin: 0 0 30px;

    font-size: clamp(16px, 2.5vw, 21px);
    line-height: 1.6;

    color: rgba(240, 241, 255, .9);

    text-shadow:
        0 2px 15px rgba(0,0,0,.8);
}


/* =========================================================
   BOTÓN
========================================================= */

.boton-inicio {
    border: 1px solid rgba(255,255,255,.35);

    padding: 14px 28px;

    border-radius: 999px;

    background: rgba(10, 15, 35, .35);

    color: rgba(255,250,240,.96);

    font-family: inherit;
    font-size: 17px;

    cursor: pointer;

    backdrop-filter: blur(8px);

    box-shadow:
        0 0 20px rgba(150,170,255,.12),
        inset 0 0 20px rgba(255,255,255,.03);

    transition:
        transform .35s ease,
        background .35s ease,
        box-shadow .35s ease;
}

.boton-inicio:hover {
    transform: translateY(-3px) scale(1.03);

    background: rgba(35, 40, 70, .5);

    box-shadow:
        0 0 25px rgba(180,195,255,.22),
        0 10px 30px rgba(0,0,0,.25);
}


/* =========================================================
   LUNA DEL INICIO
========================================================= */

.luna-inicio {
    position: absolute;

    width: 150px;
    height: 150px;

    left: 50%;
    top: 10%;

    transform: translateX(-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 32%,
            #ffffff 0%,
            #f8f4e5 42%,
            #ddd8c5 78%,
            #c8c4b4 100%
        );

    box-shadow:
        0 0 18px rgba(235,240,255,.85),
        0 0 45px rgba(200,215,255,.45),
        0 0 90px rgba(160,185,255,.2);

    opacity: .95;

    z-index: 2;

    animation: lunaRespira 6s ease-in-out infinite;

    transition:
        opacity 2s ease,
        transform 2.5s ease;
}

.luna-inicio::before {
    content: "";

    position: absolute;
    width: 18px;
    height: 18px;

    left: 38px;
    top: 42px;

    border-radius: 50%;

    background: rgba(180,175,160,.18);

    box-shadow:
        38px 25px 0 rgba(180,175,160,.13),
        60px -8px 0 rgba(180,175,160,.1),
        25px 62px 0 rgba(180,175,160,.1);
}

.luna-inicio::after {
    content: "";

    position: absolute;

    width: 145px;
    height: 145px;

    left: 42px;
    top: -12px;

    border-radius: 50%;

    background: #080d20;
}

.inicio.oculto .luna-inicio {
    opacity: 0;

    transform:
        translateX(-50%)
        translateY(-15px)
        scale(.88);
}

@keyframes lunaRespira {

    0%,
    100% {
        opacity: .84;
        box-shadow:
            0 0 18px rgba(235,240,255,.75),
            0 0 45px rgba(200,215,255,.35),
            0 0 90px rgba(160,185,255,.15);
    }

    50% {
        opacity: 1;
        box-shadow:
            0 0 25px rgba(245,245,255,.95),
            0 0 60px rgba(205,220,255,.5),
            0 0 110px rgba(160,185,255,.25);
    }
}


/* =========================================================
   ESTRELLAS DEL CIELO INICIAL
========================================================= */

.estrellas-noche {
    position: absolute;
    inset: 0;

    z-index: 3;

    pointer-events: none;

    transition: opacity 2s ease;
}

.inicio.oculto .estrellas-noche {
    opacity: 0;
}

.estrella-noche {
    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: rgba(255,255,255,.95);

    box-shadow:
        0 0 5px rgba(255,255,255,.95),
        0 0 12px rgba(210,225,255,.85),
        0 0 24px rgba(180,205,255,.45);

    animation:
        brillarEstrella
        var(--duracion)
        ease-in-out
        infinite;

    animation-delay: var(--delay);
}

.estrella-noche.grande {
    width: 6px;
    height: 6px;

    box-shadow:
        0 0 7px rgba(255,255,255,1),
        0 0 17px rgba(220,230,255,.95),
        0 0 34px rgba(180,205,255,.55);
}

@keyframes brillarEstrella {

    0%,
    100% {
        opacity: .25;
        transform: scale(.55);
    }

    40% {
        opacity: .7;
        transform: scale(.9);
    }

    50% {
        opacity: 1;
        transform: scale(1.35);
    }

    60% {
        opacity: .65;
        transform: scale(.85);
    }
}


/* =========================================================
   NUBES NOCTURNAS
========================================================= */

.nubes-inicio {
    position: absolute;
    inset: 0;

    z-index: 4;

    pointer-events: none;

    overflow: hidden;

    transition: opacity 2s ease;
}

.inicio.oculto .nubes-inicio {
    opacity: 0;
}

.nube {
    position: absolute;

    width: 190px;
    height: 55px;

    border-radius: 50px;

    background:
        radial-gradient(
            ellipse at center,
            rgba(120,135,170,.18),
            rgba(60,70,105,.08) 55%,
            transparent 75%
        );

    filter: blur(7px);

    opacity: .45;

    animation:
        moverNube
        var(--duracion)
        ease-in-out
        infinite alternate;

    animation-delay: var(--delay);
}

.nube::before,
.nube::after {
    content: "";

    position: absolute;

    border-radius: 50%;

    background: rgba(100,115,150,.13);

    filter: blur(5px);
}

.nube::before {
    width: 80px;
    height: 70px;

    left: 30px;
    bottom: 5px;
}

.nube::after {
    width: 100px;
    height: 80px;

    right: 20px;
    bottom: 0;
}

@keyframes moverNube {

    0% {
        transform: translateX(-30px);
    }

    100% {
        transform: translateX(40px);
    }
}


/* =========================================================
   ESCENA DEL ATARDECER
========================================================= */

.escena {
    position: fixed;
    inset: 0;

    overflow: hidden;

    background: #101529;
}

.escena::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(12, 10, 28, .05),
            rgba(10, 8, 25, .15)
        ),
        url("paisaje.png") center / cover no-repeat;

    opacity: 0;

    transform: scale(1.03);

    transition:
        opacity 4s ease,
        transform 9s ease;

    z-index: 1;
}

.escena.iniciado::before {
    opacity: 1;

    transform: scale(1);
}


/* =========================================================
   MOVIMIENTO MUY SUTIL DEL PAISAJE
========================================================= */

.escena.iniciado::before {
    animation: respirarPaisaje 14s ease-in-out infinite alternate;
}

@keyframes respirarPaisaje {

    0% {
        background-position: 49% 50%;
    }

    100% {
        background-position: 51% 49%;
    }
}


/* =========================================================
   BRILLO GENERAL DEL SOL
========================================================= */

.escena::after {
    content: "";

    position: absolute;

    width: 58vw;
    height: 58vw;

    max-width: 700px;
    max-height: 700px;

    left: 47%;
    top: 38%;

    transform:
        translate(-50%, -50%)
        scale(.88);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,225,165,.25) 0%,
            rgba(255,195,125,.15) 22%,
            rgba(255,165,105,.08) 43%,
            transparent 72%
        );

    opacity: 0;

    z-index: 3;

    pointer-events: none;

    mix-blend-mode: screen;
}

.escena.iniciado::after {
    opacity: 1;

    animation:
        brilloSol
        6s
        ease-in-out
        infinite;
}

@keyframes brilloSol {

    0% {
        opacity: .5;

        transform:
            translate(-50%, -50%)
            scale(.88);
    }

    50% {
        opacity: .95;

        transform:
            translate(-50%, -50%)
            scale(1.08);
    }

    100% {
        opacity: .5;

        transform:
            translate(-50%, -50%)
            scale(.88);
    }
}


/* =========================================================
   DESTELLOS CERCA DEL SOL
========================================================= */

.destellos-sol {
    position: absolute;
    inset: 0;

    z-index: 6;

    pointer-events: none;

    opacity: 0;

    transition: opacity 3s ease;
}

.escena.iniciado .destellos-sol {
    opacity: 1;
}

.destello {
    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: rgba(255,242,195,.95);

    box-shadow:
        0 0 6px rgba(255,240,185,.95),
        0 0 15px rgba(255,210,130,.8),
        0 0 30px rgba(255,180,90,.4);

    animation:
        destelloSol
        var(--duracion)
        ease-in-out
        infinite;

    animation-delay: var(--delay);
}

@keyframes destelloSol {

    0%,
    100% {
        opacity: 0;

        transform:
            scale(.35)
            translate(0, 5px);
    }

    35% {
        opacity: .45;

        transform:
            scale(.8)
            translate(3px, 0);
    }

    50% {
        opacity: 1;

        transform:
            scale(1.45)
            translate(0, -3px);
    }

    65% {
        opacity: .4;

        transform:
            scale(.75)
            translate(-3px, 0);
    }
}


/* =========================================================
   REFLEJO DEL SOL SOBRE EL AGUA
========================================================= */

.reflejo-sol {
    position: absolute;

    left: 39%;
    bottom: 13%;

    width: 24%;
    height: 30%;

    z-index: 9;

    pointer-events: none;

    opacity: 0;

    background:
        repeating-linear-gradient(
            176deg,
            transparent 0px,
            transparent 8px,
            rgba(255,225,170,.22) 9px,
            rgba(255,245,210,.45) 11px,
            transparent 13px,
            transparent 23px
        );

    filter: blur(1px);

    mask-image:
        radial-gradient(
            ellipse,
            black 0%,
            rgba(0,0,0,.85) 45%,
            transparent 75%
        );

    -webkit-mask-image:
        radial-gradient(
            ellipse,
            black 0%,
            rgba(0,0,0,.85) 45%,
            transparent 75%
        );
}

.escena.iniciado .reflejo-sol {
    opacity: 1;

    animation:
        moverReflejoSol
        4.5s
        ease-in-out
        infinite;
}

@keyframes moverReflejoSol {

    0% {
        transform:
            translateX(-10px)
            scaleX(.85);

        opacity: .35;
    }

    50% {
        transform:
            translateX(12px)
            scaleX(1.15);

        opacity: .85;
    }

    100% {
        transform:
            translateX(-6px)
            scaleX(.92);

        opacity: .45;
    }
}


/* =========================================================
   AGUA
========================================================= */

.agua {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 44%;

    z-index: 8;

    pointer-events: none;

    overflow: hidden;

    opacity: 0;

    transition: opacity 3s ease;
}

.escena.iniciado .agua {
    opacity: 1;
}


/* Movimiento principal del agua */

.agua::before {
    content: "";

    position: absolute;

    inset: -10%;

    background:
        repeating-linear-gradient(
            176deg,
            transparent 0px,
            transparent 12px,
            rgba(255,235,215,.08) 13px,
            rgba(255,245,225,.17) 15px,
            transparent 17px,
            transparent 30px
        );

    opacity: .9;

    animation:
        aguaReflejo
        7s
        linear
        infinite;
}

@keyframes aguaReflejo {

    0% {
        transform:
            translateX(-5%)
            translateY(0)
            skewX(-2deg);

        background-position:
            0 0;
    }

    50% {
        transform:
            translateX(4%)
            translateY(7px)
            skewX(2deg);

        background-position:
            35px 18px;
    }

    100% {
        transform:
            translateX(-3%)
            translateY(-4px)
            skewX(-1deg);

        background-position:
            -25px -8px;
    }
}


/* Brillo suave sobre el agua */

.agua::after {
    content: "";

    position: absolute;

    left: 20%;
    top: 0;

    width: 60%;
    height: 65%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,225,180,.16),
            transparent 70%
        );

    filter: blur(7px);

    opacity: .8;

    animation:
        reflejoAguaLuz
        5s
        ease-in-out
        infinite;
}

@keyframes reflejoAguaLuz {

    0% {
        transform:
            translateX(-20px)
            scaleX(.9);

        opacity: .25;
    }

    50% {
        transform:
            translateX(25px)
            scaleX(1.1);

        opacity: .75;
    }

    100% {
        transform:
            translateX(-10px)
            scaleX(.95);

        opacity: .35;
    }
}


/* Ondas individuales */

.onda {
    position: absolute;

    left: -25%;

    width: 150%;
    height: 90px;

    border-top:
        1px solid
        rgba(255,230,210,.12);

    border-radius: 50%;

    filter: blur(.35px);

    animation:
        moverAgua
        var(--duracion)
        ease-in-out
        infinite alternate;

    animation-delay: var(--delay);
}

@keyframes moverAgua {

    0% {
        transform:
            translateX(-5%)
            scaleX(.95);

        opacity: .25;
    }

    50% {
        transform:
            translateX(4%)
            scaleX(1.05);

        opacity: .7;
    }

    100% {
        transform:
            translateX(-3%)
            scaleX(.98);

        opacity: .35;
    }
}


/* =========================================================
   LUCIÉRNAGAS
========================================================= */

.luciernagas {
    position: absolute;
    inset: 0;

    z-index: 11;

    pointer-events: none;

    opacity: 0;

    transition: opacity 3s ease;
}

.escena.iniciado .luciernagas {
    opacity: 1;
}

.luciernaga {
    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: rgba(255,238,155,.9);

    box-shadow:
        0 0 6px rgba(255,238,155,.95),
        0 0 15px rgba(255,215,100,.6);

    animation:
        luciernagaBrilla
        var(--duracion)
        ease-in-out
        infinite alternate;

    animation-delay: var(--delay);
}

@keyframes luciernagaBrilla {

    0% {
        opacity: .15;
        transform: translate(0,0) scale(.6);
    }

    50% {
        opacity: 1;
        transform: translate(8px,-10px) scale(1.2);
    }

    100% {
        opacity: .2;
        transform: translate(-7px,6px) scale(.7);
    }
}


/* =========================================================
   HOJITAS
========================================================= */

.hojas {
    position: absolute;
    inset: 0;

    z-index: 12;

    pointer-events: none;

    opacity: 0;

    transition: opacity 3s ease;
}

.escena.iniciado .hojas {
    opacity: 1;
}

.hoja {
    position: absolute;

    top: -35px;

    width: 10px;
    height: 6px;

    border-radius: 100% 0 100% 0;

    background: rgba(205,145,90,.78);

    box-shadow:
        0 0 3px rgba(180,120,70,.25);

    animation:
        caerHoja
        var(--duracion)
        linear
        infinite;

    animation-delay: var(--delay);
}

@keyframes caerHoja {

    0% {
        transform:
            translate3d(0,-40px,0)
            rotate(0deg);

        opacity: 0;
    }

    8% {
        opacity: .85;
    }

    25% {
        transform:
            translate3d(25px,25vh,0)
            rotate(110deg);
    }

    50% {
        transform:
            translate3d(-20px,50vh,0)
            rotate(220deg);
    }

    75% {
        transform:
            translate3d(35px,75vh,0)
            rotate(300deg);
    }

    92% {
        opacity: .65;
    }

    100% {
        transform:
            translate3d(-10px,115vh,0)
            rotate(420deg);

        opacity: 0;
    }
}


/* =========================================================
   ESTRELLAS DE LOS MENSAJES
========================================================= */

.estrellas-mensaje {
    position: absolute;
    inset: 0;

    z-index: 30;

    pointer-events: none;

    opacity: 0;

    transition: opacity 3s ease;
}

.escena.iniciado .estrellas-mensaje {
    opacity: 1;
}

.estrella-mensaje {
    position: absolute;

    width: 28px;
    height: 28px;

    border: none;

    background: transparent;

    cursor: pointer;

    pointer-events: auto;

    opacity: 0;

    transform:
        scale(.35)
        rotate(-20deg);

    transition:
        opacity 2.4s ease,
        transform 2.8s cubic-bezier(.22,1,.36,1);

    display: flex;

    align-items: center;
    justify-content: center;
}

.estrella-mensaje::before {
    content: "✦";

    color: rgba(255,242,200,.95);

    font-size: 25px;

    text-shadow:
        0 0 5px rgba(255,225,150,.95),
        0 0 13px rgba(255,195,100,.75),
        0 0 27px rgba(255,175,80,.35);

    animation:
        estrellaFlota
        4s
        ease-in-out
        infinite alternate;
}

.estrella-mensaje.visible {
    opacity: 1;

    transform:
        scale(1)
        rotate(0deg);
}

.estrella-mensaje.usada {
    opacity: .28;

    transform:
        scale(.65)
        rotate(8deg);

    transition:
        opacity 3s ease,
        transform 3s ease;
}

@keyframes estrellaFlota {

    0% {
        transform:
            translateY(0)
            scale(.9);
    }

    100% {
        transform:
            translateY(-4px)
            scale(1.12);
    }
}


/* =========================================================
   MENSAJE
========================================================= */

.mensaje {
    position: absolute;

    left: 50%;
    top: 50%;

    width: min(620px, 82%);

    padding: 25px 30px;

    border-radius: 22px;

    background: rgba(15,18,38,.32);

    border:
        1px solid
        rgba(255,230,190,.13);

    backdrop-filter: blur(12px);

    color: rgba(255,248,238,.94);

    text-align: center;

    font-size: clamp(16px, 2vw, 20px);

    line-height: 1.65;

    letter-spacing: .2px;

    box-shadow:
        0 15px 50px rgba(0,0,0,.18),
        0 0 35px rgba(255,190,120,.05);

    opacity: 0;

    visibility: hidden;

    z-index: 40;

    pointer-events: none;

    transform:
        translate(-50%,-47%)
        scale(.96);

    filter: blur(2px);

    transition:
        opacity 2.2s ease,
        transform 2.4s cubic-bezier(.22,1,.36,1),
        filter 2.2s ease;
}

.mensaje.visible {
    opacity: 1;

    visibility: visible;

    transform:
        translate(-50%,-50%)
        scale(1);

    filter: blur(0);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 600px) {

    .luna-inicio {
        width: 115px;
        height: 115px;

        top: 9%;
    }

    .luna-inicio::after {
        width: 112px;
        height: 112px;

        left: 32px;
        top: -9px;
    }

    .contenido-inicio {
        padding: 20px;
    }

    .contenido-inicio h1 {
        font-size: 32px;
    }

    .mensaje {
        width: 86%;
        padding: 21px 22px;
    }

    .reflejo-sol {
        left: 34%;
        width: 32%;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     PANTALLA INICIAL
======================================================= -->

<div class="inicio" id="inicio">

    <!-- Luna -->
    <div class="luna-inicio"></div>


    <!-- Estrellas del cielo -->
    <div class="estrellas-noche">

        <span class="estrella-noche grande"
              style="left:8%; top:18%; --duracion:4.5s; --delay:.2s;"></span>

        <span class="estrella-noche"
              style="left:17%; top:31%; --duracion:5.2s; --delay:1s;"></span>

        <span class="estrella-noche grande"
              style="left:26%; top:13%; --duracion:4.1s; --delay:.5s;"></span>

        <span class="estrella-noche"
              style="left:35%; top:25%; --duracion:6s; --delay:1.5s;"></span>

        <span class="estrella-noche"
              style="left:43%; top:9%; --duracion:4.7s; --delay:.7s;"></span>

        <span class="estrella-noche grande"
              style="left:55%; top:18%; --duracion:5.5s; --delay:1.2s;"></span>

        <span class="estrella-noche"
              style="left:64%; top:10%; --duracion:4.3s; --delay:.3s;"></span>

        <span class="estrella-noche"
              style="left:73%; top:25%; --duracion:5.7s; --delay:1.8s;"></span>

        <span class="estrella-noche grande"
              style="left:84%; top:14%; --duracion:4.8s; --delay:.9s;"></span>

        <span class="estrella-noche"

<script>

/* =========================================================
   ELEMENTOS
========================================================= */

const escena =
    document.getElementById("escena");

const inicio =
    document.getElementById("inicio");

const mensaje =
    document.getElementById("mensaje");

const textoMensaje =
    document.getElementById("textoMensaje");

const estrellasMensaje =
    document.querySelectorAll(".estrella-mensaje");

let estrellaActual = 0;


/* =========================================================
   COMENZAR
========================================================= */

function comenzar() {

    /*
       Primero desaparece la pantalla nocturna.
    */

    inicio.classList.add("oculto");


    /*
       Después empieza a aparecer el paisaje.
    */

    setTimeout(() => {

        escena.classList.add("iniciado");

    }, 150);


    /*
       Esperamos un poquito para que el paisaje
       respire antes de mostrar la primera estrella.
    */

    setTimeout(() => {

        if (estrellasMensaje.length > 0) {

            estrellasMensaje[0]
                .classList
                .add("visible");

        }

    }, 2600);

}


/* =========================================================
   MOSTRAR MENSAJE
========================================================= */

function mostrarMensaje(estrella) {

    const texto =
        estrella.dataset.mensaje;


    /*
       Primero desaparece suavemente
       el mensaje anterior.
    */

    mensaje.classList.remove("visible");


    /*
       Luego aparece el nuevo.
    */

    setTimeout(() => {

        textoMensaje.innerText = texto;

        mensaje.classList.add("visible");

    }, 850);


    /*
       La estrella usada queda tenue.
    */

    estrella.classList.add("usada");

}


/* =========================================================
   ESTRELLAS INTERACTIVAS
========================================================= */

estrellasMensaje.forEach((estrella, indice) => {

    estrella.addEventListener("click", () => {

        mostrarMensaje(estrella);

        estrellaActual = indice;


        /*
           Después de unos segundos aparece
           la siguiente estrella.
        */

        setTimeout(() => {

            if (
                indice + 1 <
                estrellasMensaje.length
            ) {

                estrellasMensaje[indice + 1]
                    .classList
                    .add("visible");

            }

        }, 3600);

    });

});


/* =========================================================
   CERRAR MENSAJE AL TOCARLO
========================================================= */

mensaje.addEventListener("click", () => {

    mensaje.classList.remove("visible");

});

</script>
