<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mura 🌙</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Georgia, serif;
            color: white;
        }

        /* CIELO */

        .cielo {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 25%, #263c68 0%, #142442 35%, #07111f 75%);
        }

        /* LUNA */

        .luna {
            position: absolute;
            top: 10%;
            right: 15%;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #fff8d8;
            box-shadow:
                0 0 25px #fff8d8,
                0 0 60px rgba(255, 248, 216, 0.35);
        }

        /* ESTRELLAS */

        .estrella {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 8px white;
            animation: brillar 3s infinite alternate;
        }

        .e1 { top: 15%; left: 12%; }
        .e2 { top: 25%; left: 30%; animation-delay: 1s; }
        .e3 { top: 12%; left: 55%; animation-delay: 2s; }
        .e4 { top: 35%; left: 70%; animation-delay: 0.5s; }
        .e5 { top: 18%; left: 82%; animation-delay: 1.5s; }
        .e6 { top: 42%; left: 20%; animation-delay: 2.5s; }
        .e7 { top: 30%; left: 45%; animation-delay: 1.2s; }
        .e8 { top: 20%; left: 92%; animation-delay: 0.8s; }

        @keyframes brillar {
            from {
                opacity: 0.3;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        /* MONTAÑAS */

        .montana {
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
            border-left: 180px solid transparent;
            border-right: 180px solid transparent;
            border-bottom: 260px solid #081a27;
        }

        .m1 {
            left: -100px;
        }

        .m2 {
            left: 25%;
            border-bottom-height: 320px;
        }

        .m3 {
            right: -100px;
        }

        /* PAISAJE */

        .suelo {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 25%;
            background: linear-gradient(
                to bottom,
                #102d2b,
                #071a19
            );
        }

        /* LUCES */

        .luz {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #d9ffd8;
            box-shadow: 0 0 15px #d9ffd8;
            animation: flotar 4s infinite alternate ease-in-out;
        }

        .l1 { bottom: 22%; left: 15%; }
        .l2 { bottom: 30%; left: 28%; animation-delay: 1s; }
        .l3 { bottom: 20%; left: 45%; animation-delay: 2s; }
        .l4 { bottom: 28%; left: 62%; animation-delay: 0.5s; }
        .l5 { bottom: 18%; left: 80%; animation-delay: 1.5s; }

        @keyframes flotar {
            from {
                transform: translateY(0);
                opacity: 0.4;
            }

            to {
                transform: translateY(-15px);
                opacity: 1;
            }
        }

        /* CONTENIDO */

        .inicio {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
        }

        .inicio h1 {
            font-size: clamp(42px, 8vw, 75px);
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255,255,255,0.35);
        }

        .inicio p {
            font-size: clamp(18px, 3vw, 25px);
            margin-bottom: 35px;
            opacity: 0.9;
        }

        button {
            border: 1px solid rgba(255,255,255,0.5);
            padding: 15px 35px;
            border-radius: 40px;
            font-size: 19px;
            cursor: pointer;
            background: rgba(255,255,255,0.12);
            color: white;
            backdrop-filter: blur(8px);
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
            background: rgba(255,255,255,0.2);
        }

        /* COCHE */

        .coche {
            position: absolute;
            bottom: 12%;
            left: -100px;
            font-size: 45px;
            animation: conducir 8s linear infinite;
            z-index: 5;
        }

        @keyframes conducir {
            from {
                left: -100px;
            }

            to {
                left: 110%;
            }
        }
    </style>
</head>

<body>

    <main class="cielo">

        <div class="luna"></div>

        <div class="estrella e1"></div>
        <div class="estrella e2"></div>
        <div class="estrella e3"></div>
        <div class="estrella e4"></div>
        <div class="estrella e5"></div>
        <div class="estrella e6"></div>
        <div class="estrella e7"></div>
        <div class="estrella e8"></div>

        <div class="montana m1"></div>
        <div class="montana m2"></div>
        <div class="montana m3"></div>

        <div class="suelo"></div>

        <div class="luz l1"></div>
        <div class="luz l2"></div>
        <div class="luz l3"></div>
        <div class="luz l4"></div>
        <div class="luz l5"></div>

        <div class="coche">🏎️</div>

        <section class="inicio">

            <h1>Hey, Mura...</h1>

            <p>Preparé una pequeña cosa para ti. 💗</p>

            <button onclick="comenzar()">
                Empezar 🏎️
            </button>

        </section>

    </main>

    <script>
        function comenzar() {
            alert("Nuestro viaje comienza aquí 🏎️🌙");
        }
    </script>

</body>
</html>
