<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para alguien especial 🌙</title>

<style>

/* =========================================================
   🌌 CONFIGURACIÓN GENERAL
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family: Georgia, "Times New Roman", serif;

    background: #050914;
}

body {
    color: white;
}


/* =========================================================
   🌌 ESCENA PRINCIPAL
   ========================================================= */

.escena {
    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;

    background-image: url("bosque-noche.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    transition:
        background-image 2s ease,
        filter 1.5s ease,
        transform 2s ease;
}


/* Cuando comienza el viaje aparece el paisaje */
.escena.iniciado {
    background-image: url("paisaje.png");
    background-size: cover;
    background-position: center;

    animation: respirarEscena 14s ease-in-out infinite alternate;
}


/* =========================================================
   🌅 MOVIMIENTO MUY SUAVE DEL PAISAJE
   ========================================================= */

@keyframes respirarEscena {

    0% {
        background-position: 50% 50%;
    }

    100% {
        background-position: 51% 49%;
    }
}


/* =========================================================
   ✨ TRANSICIÓN MÁGICA
   ========================================================= */

.transicion-magica {
    position: absolute;

    inset: -30%;

    z-index: 19;

    pointer-events: none;

    opacity: 0;

    transform: scale(0.15);

    background:
        radial-gradient(
            circle at center,
            rgba(255, 255, 240, 0.98) 0%,
            rgba(255, 235, 194, 0.90) 7%,
            rgba(255, 200, 145, 0.50) 17%,
            rgba(255, 160, 110, 0.18) 32%,
            transparent 58%
        );

    filter: blur(2px);
}


/* ✨ Halo que se expande */
.transicion-magica::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 20%;
    height: 20%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    border: 2px solid rgba(255, 239, 205, 0.75);

    box-shadow:
        0 0 30px rgba(255, 220, 170, 0.75),
        0 0 80px rgba(255, 190, 130, 0.45),
        0 0 150px rgba(255, 180, 120, 0.25);

    opacity: 0;
}


/* ✨ Pequeños puntos de luz durante la transición */
.transicion-magica::after {
    content: "";

    position: absolute;

    inset: 0;

    background:

        radial-gradient(
            circle at 32% 35%,
            rgba(255,255,255,0.9) 0 2px,
            transparent 4px
        ),

        radial-gradient(
            circle at 68% 30%,
            rgba(255,245,210,0.8) 0 2px,
            transparent 5px
        ),

        radial-gradient(
            circle at 74% 66%,
            rgba(255,255,255,0.75) 0 2px,
            transparent 5px
        ),

        radial-gradient(
            circle at 25% 70%,
            rgba(255,230,180,0.8) 0 2px,
            transparent 5px
        );

    opacity: 0;
}


/* Cuando empieza la transición */
.escena.transicionando .transicion-magica {
    animation: transicionMagica 2.5s ease-in-out forwards;
}

.escena.transicionando .transicion-magica::before {
    animation: circuloMagico 2.3s ease-out forwards;
}

.escena.transicionando .transicion-magica::after {
    animation: particulasTransicion 2.2s ease-out forwards;
}


/* La escena se ilumina brevemente */
.escena.transicionando {
    filter:
        brightness(1.22)
        saturate(1.08);

    transform: scale(1.025);
}


@keyframes transicionMagica {

    0% {
        opacity: 0;
        transform: scale(0.12);
    }

    18% {
        opacity: 1;
        transform: scale(0.45);
    }

    45% {
        opacity: 1;
        transform: scale(1.15);
    }

    68% {
        opacity: 0.85;
        transform: scale(1.55);
    }

    100% {
        opacity: 0;
        transform: scale(2.4);
    }
}


@keyframes circuloMagico {

    0% {
        opacity: 0;
        width: 10%;
        height: 10%;
    }

    30% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        width: 130%;
        height: 130%;
    }
}


@keyframes particulasTransicion {

    0% {
        opacity: 0;
        transform: scale(0.6);
    }

    25% {
        opacity: 1;
    }

    65% {
        opacity: 0.8;
        transform: scale(1.1);
    }

    100% {
        opacity: 0;
        transform: scale(1.5);
    }
}


/* =========================================================
   🌳 HOJAS DEL ÁRBOL
   ========================================================= */

/*
   Esta capa conserva las hojas del árbol de
   bosque-noche.jpg cuando aparece paisaje.png.
*/

.arbol-hojas {
    position: absolute;

    inset: 0;

    z-index: 3;

    pointer-events: none;

    opacity: 0;

    background-image: url("bosque-noche.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    /*
       Conservamos principalmente la zona
       superior izquierda donde están las hojas.
    */
    clip-path: polygon(
        0 0,
        43% 0,
        39% 7%,
        36% 14%,
        32% 21%,
        28% 29%,
        31% 36%,
        25% 43%,
        18% 49%,
        0 55%
    );

    filter:
        brightness(1.08)
        saturate(1.08);

    transition:
        opacity 2s ease;
}


/*
   Las hojas aparecen suavemente junto
   con el nuevo paisaje.
*/
.escena.iniciado .arbol-hojas {
    opacity: 0.98;
}


/* =========================================================
   🌅 CAPA DE LUZ DEL PAISAJE
   ========================================================= */

.escena::before {
    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(20, 25, 60, 0.10),
            transparent 35%,
            rgba(8, 10, 25, 0.12)
        );

    opacity: 0;

    pointer-events: none;

    transition: opacity 3s ease;

    z-index: 1;
}

.escena.iniciado::before {
    opacity: 1;
}


/* =========================================================
   ☀️ BRILLO DEL SOL
   ========================================================= */

.escena::after {
    content: "";

    position: absolute;

    width: 520px;
    height: 520px;

    right: 7%;
    top: 38%;

    transform: translate(50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255, 247, 220, 0.44) 0%,
            rgba(255, 213, 157, 0.25) 18%,
            rgba(255, 180, 110, 0.13) 38%,
            rgba(255, 160, 90, 0.05) 58%,
            transparent 75%
        );

    filter: blur(10px);

    pointer-events: none;

    z-index: 5;

    opacity: 0;

    transition: opacity 3s ease;
}

.escena.iniciado::after {
    opacity: 1;

    animation:
        brilloSolRealista 5s ease-in-out infinite;
}


@keyframes brilloSolRealista {

    0% {
        opacity: 0.52;

        transform:
            translate(50%, -50%)
            scale(0.92);

        filter: blur(13px);
    }

    35% {
        opacity: 0.78;

        transform:
            translate(50%, -50%)
            scale(1.04);

        filter: blur(9px);
    }

    65% {
        opacity: 0.66;

        transform:
            translate(50%, -50%)
            scale(1.08);

        filter: blur(12px);
    }

    100% {
        opacity: 0.52;

        transform:
            translate(50%, -50%)
            scale(0.94);

        filter: blur(14px);
    }
}


/* =========================================================
   🌙 LUNA DE LA PANTALLA INICIAL
   ========================================================= */

.luna-inicio {
    position: absolute;

    width: 145px;
    height: 145px;

    right: 13%;
    top: 13%;

    border-radius: 50%;

    z-index: 5;

    background:
        radial-gradient(
            circle at 29% 33%,
            rgba(165,164,151,0.28) 0 7px,
            transparent 8px
        ),

        radial-gradient(
            circle at 58% 25%,
            rgba(150,150,140,0.22) 0 9px,
            transparent 10px
        ),

        radial-gradient(
            circle at 42% 65%,
            rgba(150,150,140,0.24) 0 12px,
            transparent 13px
        ),

        radial-gradient(
            circle at 68% 61%,
            rgba(140,140,132,0.18) 0 7px,
            transparent 8px
        ),

        radial-gradient(
            circle at 36% 19%,
            rgba(145,145,137,0.20) 0 5px,
            transparent 6px
        ),

        radial-gradient(
            circle at 35% 35%,
            #ffffff 0%,
            #f7f3e7 45%,
            #ddd9c8 75%,
            #c4c0b0 100%
        );

    box-shadow:
        0 0 15px rgba(255,255,235,0.75),
        0 0 35px rgba(190,210,255,0.35),
        0 0 75px rgba(170,190,255,0.20);

    animation:
        lunaRespira 5s ease-in-out infinite;
}


/* Parte oscura de la media luna */
.luna-inicio::after {
    content: "";

    position: absolute;

    width: 130px;
    height: 130px;

    right: -17px;
    top: -5px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 40% 40%,
            rgba(19,27,55,0.95),
            rgba(7,12,29,0.98) 70%
        );

    opacity: 0.98;
}


/* Halo */
.luna-inicio::before {
    content: "";

    position: absolute;

    inset: -18px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(190,210,255,0.10),
            transparent 65%
        );

    filter: blur(7px);

    z-index: -1;

    animation:
        haloLuna 5s ease-in-out infinite;
}


@keyframes lunaRespira {

    0% {
        transform: scale(0.98);
        filter: brightness(0.95);
    }

    50% {
        transform: scale(1.025);
        filter: brightness(1.08);
    }

    100% {
        transform: scale(0.98);
        filter: brightness(0.95);
    }
}


@keyframes haloLuna {

    0% {
        opacity: 0.45;
        transform: scale(0.95);
    }

    50% {
        opacity: 0.85;
        transform: scale(1.08);
    }

    100% {
        opacity: 0.45;
        transform: scale(0.95);
    }
}


/* La luna desaparece al comenzar */
.escena.iniciado .luna-inicio {
    opacity: 0;

    transform: scale(0.7);

    pointer-events: none;

    transition:
        opacity 2s ease,
        transform 2s ease;
}


/* =========================================================
   ✨ ESTRELLAS DEL CIELO INICIAL
   ========================================================= */

.estrellas-noche {
    position: absolute;

    inset: 0;

    z-index: 4;

    pointer-events: none;

    transition: opacity 2s ease;
}


.estrella-noche {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.95);

    box-shadow:
        0 0 5px rgba(255,255,255,0.85),
        0 0 12px rgba(190,215,255,0.55);

    animation:
        parpadeoEstrella 3.5s ease-in-out infinite;
}


/* Estrellas grandes con destello */
.estrella-noche.grande::before,
.estrella-noche.grande::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(255,255,255,0.95),
            transparent
        );

    border-radius: 50%;

    animation:
        destelloEstrella 3s ease-in-out infinite;
}


.estrella-noche.grande::before {
    width: 2px;
    height: 27px;
}


.estrella-noche.grande::after {
    width: 27px;
    height: 2px;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(255,255,255,0.95),
            transparent
        );
}


@keyframes parpadeoEstrella {

    0%,
    100% {
        opacity: 0.35;
        transform: scale(0.75);
    }

    50% {
        opacity: 1;
        transform: scale(1.2);
    }
}


@keyframes destelloEstrella {

    0%,
    100% {
        opacity: 0.10;

        transform:
            translate(-50%, -50%)
            scale(0.55);
    }

    45% {
        opacity: 0.80;

        transform:
            translate(-50%, -50%)
            scale(1);
    }

    60% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.2);
    }
}


/* Posiciones */
.estrella-noche:nth-child(1) {
    left: 12%;
    top: 17%;
    animation-delay: -1s;
}

.estrella-noche:nth-child(2) {
    left: 24%;
    top: 11%;
    animation-delay: -2.5s;
}

.estrella-noche:nth-child(3) {
    left: 38%;
    top: 19%;
    animation-delay: -0.8s;
}

.estrella-noche:nth-child(4) {
    left: 54%;
    top: 9%;
    animation-delay: -1.8s;
}

.estrella-noche:nth-child(5) {
    left: 69%;
    top: 18%;
    animation-delay: -3s;
}

.estrella-noche:nth-child(6) {
    left: 83%;
    top: 10%;
    animation-delay: -1.2s;
}

.estrella-noche:nth-child(7) {
    left: 91%;
    top: 28%;
    animation-delay: -2.2s;
}

.estrella-noche:nth-child(8) {
    left: 45%;
    top: 30%;
    animation-delay: -1.4s;
}

.estrella-noche:nth-child(9) {
    left: 74%;
    top: 34%;
    animation-delay: -2.8s;
}

.estrella-noche:nth-child(10) {
    left: 18%;
    top: 33%;
    animation-delay: -0.5s;
}


.escena.iniciado .estrellas-noche {
    opacity: 0;
}


/* =========================================================
   ☁️ NUBES
   ========================================================= */

.nubes-inicio {
    position: absolute;

    inset: 0;

    z-index: 4;

    pointer-events: none;

    transition: opacity 2.5s ease;
}


.nube {
    position: absolute;

    width: 190px;
    height: 45px;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(210,215,235,0.24),
            rgba(150,160,190,0.08) 55%,
            transparent 75%
        );

    filter: blur(5px);

    animation:
        nubeMovimiento 24s ease-in-out infinite alternate;
}


.nube:nth-child(1) {
    left: 22%;
    top: 34%;

    transform: scale(0.85);
}


.nube:nth-child(2) {
    left: 32%;
    top: 45%;

    transform: scale(1.15);

    animation-delay: -7s;
}


.nube:nth-child(3) {
    left: 58%;
    top: 61%;

    transform: scale(0.90);

    animation-delay: -13s;
}


@keyframes nubeMovimiento {

    0% {
        transform:
            translateX(-15px)
            scale(0.95);

        opacity: 0.35;
    }

    100% {
        transform:
            translateX(25px)
            scale(1.05);

        opacity: 0.55;
    }
}


.escena.iniciado .nubes-inicio {
    opacity: 0;
}


/* =========================================================
   ✨ DESTELLOS DEL SOL
   ========================================================= */

.destellos-sol {
    position: absolute;

    inset: 0;

    z-index: 6;

    pointer-events: none;

    opacity: 0;

    transition: opacity 3s ease;
}


.escena.iniciado .destellos-sol {
    opacity: 1;
}


.destello {
    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background:
        rgba(255,235,194,0.95);

    box-shadow:
        0 0 8px rgba(255,220,170,0.85),
        0 0 18px rgba(255,190,120,0.40);

    animation:
        destelloSol 3.8s ease-in-out infinite;
}


.destello:nth-child(1) {
    left: 78%;
    top: 53%;
    animation-delay: 0s;
}

.destello:nth-child(2) {
    left: 84%;
    top: 59%;
    animation-delay: -1.2s;
}

.destello:nth-child(3) {
    left: 74%;
    top: 62%;
    animation-delay: -2.1s;
}

.destello:nth-child(4) {
    left: 88%;
    top: 68%;
    animation-delay: -0.7s;
}

.destello:nth-child(5) {
    left: 80%;
    top: 73%;
    animation-delay: -2.8s;
}

.destello:nth-child(6) {
    left: 69%;
    top: 65%;
    animation-delay: -1.7s;
}


@keyframes destelloSol {

    0% {
        opacity: 0.18;
        transform: scale(0.65);
    }

    40% {
        opacity: 0.8;
        transform: scale(1.15);
    }

    60% {
        opacity: 0.95;
        transform: scale(1.35);
    }

    100% {
        opacity: 0.15;
        transform: scale(0.7);
    }
}


/* =========================================================
   🌊 AGUA
   ========================================================= */

.agua {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 43%;

    z-index: 7;

    pointer-events: none;

    overflow: hidden;

    background: transparent;
}


/* Reflejos grandes */
.agua::before {
    content: "";

    position: absolute;

    inset: -10% -15%;

    background:

        radial-gradient(
            ellipse 180px 20px at 15% 25%,
            rgba(255,226,190,0.18),
            transparent 72%
        ),

        radial-gradient(
            ellipse 240px 24px at 45% 42%,
            rgba(255,214,170,0.14),
            transparent 72%
        ),

        radial-gradient(
            ellipse 190px 18px at 75% 30%,
            rgba(255,231,200,0.16),
            transparent 70%
        ),

        radial-gradient(
            ellipse 300px 28px at 65% 70%,
            rgba(255,191,135,0.14),
            transparent 75%
        ),

        radial-gradient(
            ellipse 220px 20px at 30% 78%,
            rgba(180,205,255,0.10),
            transparent 75%
        );

    background-size:
        125% 115%;

    background-position:
        0% 0%;

    filter:
        blur(5px);

    opacity: 0.8;

    animation:
        aguaMovimiento 8s ease-in-out infinite alternate;
}


/* Reflejo dorado */
.agua::after {
    content: "";

    position: absolute;

    left: 30%;
    top: 5%;

    width: 55%;
    height: 85%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,218,172,0.24) 0%,
            rgba(255,192,130,0.10) 22%,
            transparent 65%
        );

    filter: blur(12px);

    opacity: 0.65;

    transform-origin: center;

    animation:
        reflejoAgua 5s ease-in-out infinite alternate;
}


@keyframes aguaMovimiento {

    0% {
        transform:
            translate3d(-2%,0,0)
            scale(1);

        background-position:
            0% 0%;
    }

    50% {
        transform:
            translate3d(1%,-1%,0)
            scale(1.025);

        background-position:
            3% 2%;
    }

    100% {
        transform:
            translate3d(2%,1%,0)
            scale(1.045);

        background-position:
            6% 0%;
    }
}


@keyframes reflejoAgua {

    0% {
        transform:
            translateX(-3%)
            scaleX(0.94);

        opacity: 0.45;
    }

    50% {
        transform:
            translateX(2%)
            scaleX(1.02);

        opacity: 0.72;
    }

    100% {
        transform:
            translateX(5%)
            scaleX(1.08);

        opacity: 0.55;
    }
}


/* =========================================================
   🌊 PEQUEÑOS REFLEJOS
   ========================================================= */

.onda {
    position: absolute;

    height: 10px;
    width: 120px;

    border: none !important;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,226,194,0.20) 0%,
            rgba(255,226,194,0.08) 35%,
            transparent 72%
        );

    filter: blur(3px);

    opacity: 0.45;

    animation:
        ondaSuave 6s ease-in-out infinite alternate;
}


.onda:nth-child(1) {
    left: 15%;
    top: 20%;

    animation-delay: -1s;

    width: 150px;
}

.onda:nth-child(2) {
    left: 35%;
    top: 32%;

    animation-delay: -3s;

    width: 100px;
}

.onda:nth-child(3) {
    left: 55%;
    top: 45%;

    animation-delay: -5s;

    width: 180px;
}

.onda:nth-child(4) {
    left: 70%;
    top: 55%;

    animation-delay: -2s;

    width: 130px;
}

.onda:nth-child(5) {
    left: 25%;
    top: 68%;

    animation-delay: -4s;

    width: 200px;
}

.onda:nth-child(6) {
    left: 48%;
    top: 78%;

    animation-delay: -1.5s;

    width: 110px;
}

.onda:nth-child(7) {
    left: 78%;
    top: 82%;

    animation-delay: -3.5s;

    width: 160px;
}


@keyframes ondaSuave {

    0% {
        transform:
            translateX(-15px)
            scaleX(0.82);

        opacity: 0.25;
    }

    50% {
        transform:
            translateX(10px)
            scaleX(1.12);

        opacity: 0.52;
    }

    100% {
        transform:
            translateX(25px)
            scaleX(0.92);

        opacity: 0.32;
    }
}


/* =========================================================
   ✨ LUCIÉRNAGAS
   ========================================================= */

.luciernagas {
    position: absolute;

    inset: 0;

    z-index: 8;

    pointer-events: none;
}


.luciernaga {
    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #fff4a8;

    box-shadow:
        0 0 7px #fff0a0,
        0 0 15px rgba(255,219,100,0.75);

    animation:
        luciernagaMovimiento 6s ease-in-out infinite,
        luciernagaBrillo 2.8s ease-in-out infinite;
}


.luciernaga:nth-child(1) {
    left: 13%;
    top: 62%;
    animation-delay: -1s;
}

.luciernaga:nth-child(2) {
    left: 22%;
    top: 72%;
    animation-delay: -3s;
}

.luciernaga:nth-child(3) {
    left: 31%;
    top: 58%;
    animation-delay: -2s;
}

.luciernaga:nth-child(4) {
    left: 42%;
    top: 69%;
    animation-delay: -4s;
}

.luciernaga:nth-child(5) {
    left: 55%;
    top: 61%;
    animation-delay: -1.5s;
}

.luciernaga:nth-child(6) {
    left: 65%;
    top: 72%;
    animation-delay: -3.5s;
}

.luciernaga:nth-child(7) {
    left: 77%;
    top: 58%;
    animation-delay: -2.5s;
}

.luciernaga:nth-child(8) {
    left: 88%;
    top: 70%;
    animation-delay: -4.5s;
}


@keyframes luciernagaMovimiento {

    0%,
    100% {
        transform:
            translate(0,0);
    }

    25% {
        transform:
            translate(8px,-13px);
    }

    50% {
        transform:
            translate(-7px,-22px);
    }

    75% {
        transform:
            translate(12px,-8px);
    }
}


@keyframes luciernagaBrillo {

    0%,
    100% {
        opacity: 0.25;
        transform: scale(0.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.25);
    }
}


/* =========================================================
   🍃 HOJAS QUE CAEN
   ========================================================= */

.hojas {
    position: absolute;

    inset: 0;

    z-index: 9;

    pointer-events: none;

    overflow: hidden;
}


.hoja {
    position: absolute;

    width: 9px;
    height: 15px;

    border-radius:
        100% 0 100% 0;

    background:
        rgba(120,150,95,0.65);

    opacity: 0;

    animation:
        hojaCaer 10s linear infinite;
}


.hoja:nth-child(1) {
    left: 18%;
    animation-delay: -2s;
}

.hoja:nth-child(2) {
    left: 37%;
    animation-delay: -6s;
}

.hoja:nth-child(3) {
    left: 62%;
    animation-delay: -4s;
}

.hoja:nth-child(4) {
    left: 82%;
    animation-delay: -8s;
}


@keyframes hojaCaer {

    0% {
        top: -10%;

        opacity: 0;

        transform:
            rotate(0deg)
            translateX(0);
    }

    15% {
        opacity: 0.55;
    }

    50% {
        transform:
            rotate(180deg)
            translateX(40px);
    }

    85% {
        opacity: 0.35;
    }

    100% {
        top: 110%;

        opacity: 0;

        transform:
            rotate(360deg)
            translateX(-30px);
    }
}


/* =========================================================
   ⭐ ESTRELLAS DE LOS MENSAJES
   ========================================================= */

.estrellas-mensaje {
    position: absolute;

    inset: 0;

    z-index: 15;

    pointer-events: none;

    opacity: 0;

    transition:
        opacity 2s ease;
}


.escena.iniciado .estrellas-mensaje {
    opacity: 1;
}


.estrella-mensaje {
    position: absolute;

    width: 18px;
    height: 18px;

    border-radius: 50%;

    cursor: pointer;

    pointer-events: auto;

    background:
        radial-gradient(
            circle,
            white 0%,
            rgba(255,245,220,0.95) 25%,
            rgba(255,215,150,0.55) 45%,
            transparent 72%
        );

    box-shadow:
        0 0 8px rgba(255,245,210,0.9),
        0 0 18px rgba(255,214,145,0.65);

    transform: scale(0);

    animation:
        aparecerEstrella 1.4s ease forwards,
        estrellaMensajeBrilla 2.8s ease-in-out infinite 1.4s;
}


.estrella-mensaje::before,
.estrella-mensaje::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(255,255,255,0.85),
            transparent
        );

    border-radius: 50%;

    opacity: 0.65;
}


.estrella-mensaje::before {
    width: 2px;
    height: 30px;
}


.estrella-mensaje::after {
    width: 30px;
    height: 2px;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(255,255,255,0.85),
            transparent
        );
}


@keyframes aparecerEstrella {

    from {
        opacity: 0;
        transform: scale(0);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


@keyframes estrellaMensajeBrilla {

    0%,
    100% {
        filter: brightness(0.85);
        transform: scale(0.92);
    }

    50% {
        filter: brightness(1.35);
        transform: scale(1.12);
    }
}


/* =========================================================
   💌 MENSAJES
   ========================================================= */

.mensaje {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width:
        min(620px, 82%);

    z-index: 18;

    text-align: center;

    padding:
        25px 28px;

    border-radius: 22px;

    background:
        rgba(12,17,38,0.48);

    backdrop-filter:
        blur(12px);

    box-shadow:
        0 15px 50px rgba(0,0,0,0.25),
        0 0 35px rgba(150,180,255,0.10);

    opacity: 0;

    visibility: hidden;

    filter:
        blur(8px);

    transition:
        opacity 1.2s ease,
        filter 1.2s ease,
        visibility 1.2s ease;
}


.mensaje.visible {
    opacity: 1;

    visibility: visible;

    filter:
        blur(0);
}


.mensaje p {
    font-size:
        clamp(1rem, 2.5vw, 1.3rem);

    line-height: 1.75;

    color:
        rgba(255,255,255,0.94);

        0 2px 8px rgba(0,0,0,0.5);
}


/* =========================================================

   ========================================================= */

.inicio {
    position: absolute;

    inset: 0;

    z-index: 20;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 25px;

        radial-gradient(

            rgba(10,15,35,0.12),

        );

        visibility 2.2s ease;
}


.inicio.oculto {

.inicio h1 {

        0 0 12px rgba(255,255,255,0.35),

        0 2px 8px rgba(0,0,0,0.7);
}


/* =========================================================
   ✦ BOTÓN EMPEZAR
   ========================================================= */

#comenzar {

<script>

/* =========================================================
   💌 MENSAJES
   ========================================================= */

const mensajes = [

    "Quería hacerte una pequeña cosa... simplemente porque pensé en ti.",

    "Hay momentos pequeños contigo que recuerdo y que me hacen sonreír.",

    "Gracias por escucharme y por preguntarme cómo estoy.",

    "Admiro que, incluso cuando las cosas se ponen difíciles, sigas intentando avanzar.",

    "Y sí... seguiré diciéndote nuv y viejito cuando te quejes de algo. 🥺",

    "Hay una última cosa que quiero decirte..."

];


/* =========================================================
   ⭐ POSICIONES
   ========================================================= */

const posiciones = [

    {
        left: "17%",
        top: "38%"
    },

    {
        left: "31%",
        top: "25%"
    },

    {
        left: "47%",
        top: "22%"
    },

    {
        left: "65%",
        top: "30%"
    },

    {
        left: "78%",
        top: "42%"
    },

    {
        left: "52%",
        top: "55%"
    }

];


/* =========================================================
   🎬 ELEMENTOS
   ========================================================= */

const escena =
    document.getElementById("escena");

const inicio =
    document.getElementById("inicio");

const comenzar =
    document.getElementById("comenzar");

const estrellasMensaje =
    document.getElementById("estrellasMensaje");

const mensaje =
    document.getElementById("mensaje");

const textoMensaje =
    document.getElementById("textoMensaje");


/* =========================================================
   ⭐ ESTADO
   ========================================================= */

let indice = 0;

let estrellaActual = null;

let mostrandoMensaje = false;


/* =========================================================
   ✦ COMENZAR
   ========================================================= */

comenzar.addEventListener("click", () => {

    /*
       Primero comienza la transición.
       El paisaje todavía no cambia.
    */

    escena.classList.add("transicionando");


    /*
       Después de un pequeño destello,
       cambiamos al paisaje.
    */

    setTimeout(() => {

        escena.classList.add("iniciado");

        inicio.classList.add("oculto");

    }, 420);


    /*
       Dejamos que la transición termine
       antes de mostrar la primera estrella.
    */

    setTimeout(() => {

        escena.classList.remove("transicionando");

    }, 2600);


    /*
       Primera estrella después de que
       el paisaje haya terminado de aparecer.
    */

    setTimeout(() => {

        mostrarSiguienteEstrella();

    }, 3000);

});


/* =========================================================
   ⭐ SIGUIENTE ESTRELLA
   ========================================================= */

function mostrarSiguienteEstrella() {

    if (indice >= mensajes.length) {
        return;
    }


    const estrella =
        document.createElement("div");


    estrella.className =
        "estrella-mensaje";


    estrella.style.left =
        posiciones[indice].left;


    estrella.style.top =
        posiciones[indice].top;


    estrellasMensaje.appendChild(
        estrella
    );


    estrellaActual =
        estrella;


    estrella.addEventListener(
        "click",
        () => {

            if (mostrandoMensaje) {
                return;
            }

            mostrarMensaje(indice);

        }
    );

}


/* =========================================================
   💌 MOSTRAR MENSAJE
   ========================================================= */

function mostrarMensaje(numero) {

    mostrandoMensaje = true;


    /*
       La estrella desaparece suavemente.
    */

    if (estrellaActual) {

        estrellaActual.style.transition =
            "opacity 1s ease, transform 1s ease";

        estrellaActual.style.opacity =
            "0";

        estrellaActual.style.transform =
            "scale(0.3)";
    }


    /*
       Aparece el mensaje.
    */

    setTimeout(() => {

        textoMensaje.textContent =
            mensajes[numero];

        mensaje.classList.add(
            "visible"
        );

    }, 350);


    /*
       Desaparece suavemente.
    */

    setTimeout(() => {

        mensaje.classList.remove(
            "visible"
        );

    }, 5200);


    /*
       Siguiente estrella.
    */

    setTimeout(() => {

        if (estrellaActual) {
            estrellaActual.remove();
        }


        indice++;

        mostrandoMensaje = false;


        if (indice < mensajes.length) {

            setTimeout(() => {

                mostrarSiguienteEstrella();

            }, 1200);

        }

    }, 6500);

}

</script>
