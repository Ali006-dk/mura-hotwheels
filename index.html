<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Tu 🌙</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Georgia, serif;
}

body {
    background: #050b18;
}


/* ==================================================
   ESCENARIO PRINCIPAL
================================================== */

.escena {

    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;

    background-image:
        url("bosque-noche.jpg");

    background-size: cover;
    background-position: center;

    background-color: #050b18;

    transition:
        filter 8s ease,
        background-position 12s ease;

}


/* ==================================================
   OSCURECER EL PAISAJE
   Esto ayuda a que no canse la vista
================================================== */

.oscuridad {

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            to bottom,
            rgba(2, 8, 25, 0.48),
            rgba(4, 12, 30, 0.28),
            rgba(2, 8, 20, 0.55)
        );

    pointer-events: none;

    z-index: 2;

    transition:
        background 8s ease;

}


/* ==================================================
   LUZ SUAVE DE LUNA
================================================== */

.luz-luna {

    position: absolute;

    width: 500px;
    height: 500px;

    top: -180px;
    left: 0px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(160,185,255,0.13) 0%,
            rgba(100,130,210,0.07) 35%,
            transparent 70%
        );

    pointer-events: none;

    z-index: 3;

    transition:
        opacity 8s ease,
        transform 8s ease;

}


/* ==================================================
   ESTRELLAS
================================================== */

.estrellas {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 4;

    transition:
        opacity 8s ease;

}

.estrella {

    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: rgba(220,230,255,0.85);

    box-shadow:
        0 0 5px rgba(190,215,255,0.7);

    animation:
        brillar 4s infinite alternate ease-in-out;

}

@keyframes brillar {

    from {
        opacity: 0.25;
        transform: scale(0.7);
    }

    to {
        opacity: 0.9;
        transform: scale(1.3);
    }

}


/* ==================================================
   NIEBLA
================================================== */

.niebla {

    position: absolute;

    width: 120%;
    height: 35%;

    left: -10%;
    bottom: -5%;

    background:

        radial-gradient(
            ellipse at center,
            rgba(180,200,230,0.13),
            transparent 68%
        );

    filter: blur(30px);

    pointer-events: none;

    z-index: 5;

    animation:
        moverNiebla 18s infinite alternate ease-in-out;

}

@keyframes moverNiebla {

    from {
        transform: translateX(-2%);
    }

    to {
        transform: translateX(2%);
    }

}


/* ==================================================
   LUCIÉRNAGAS
================================================== */

.luciernagas {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 7;

    opacity: 0;

    transition:
        opacity 8s ease;

}

.luz {

    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #e9dc8d;

    box-shadow:

        0 0 8px rgba(255,235,130,0.8),
        0 0 18px rgba(255,210,100,0.45);

    animation:
        flotar 5s infinite alternate ease-in-out;

}

@keyframes flotar {

    from {
        transform: translateY(5px);
        opacity: 0.3;
    }

    to {
        transform: translateY(-20px);
        opacity: 0.9;
    }

}


/* ==================================================
   PANTALLA DE INICIO
================================================== */

.inicio {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    z-index: 20;

    padding: 25px;

    transition:
        opacity 2s ease,
        visibility 2s ease;

}

.inicio.oculto {

    opacity: 0;

    visibility: hidden;

}


/* ==================================================
   TEXTO
================================================== */

.titulo {

    color: #eef2ff;

    font-size:
        clamp(35px, 6vw, 70px);

    font-weight: normal;

    letter-spacing: 1px;

    text-shadow:

        0 0 12px rgba(180,200,255,0.45),
        0 0 30px rgba(90,120,190,0.25);

    margin-bottom: 18px;

}


.subtitulo {

    color:
        rgba(225,232,250,0.82);

    font-size: 17px;

    letter-spacing: .5px;

    margin-bottom: 34px;

}


/* ==================================================
   BOTÓN
================================================== */

.boton {

    padding:
        14px 38px;

    border-radius: 40px;

    border:
        1px solid rgba(220,230,255,0.4);

    background:
        rgba(20,35,70,0.35);

    color:
        rgba(240,245,255,0.95);

    font-size: 17px;

    cursor: pointer;

    backdrop-filter: blur(10px);

    box-shadow:

        0 0 18px rgba(100,130,200,0.18);

    transition:

        transform .3s ease,
        background .3s ease,
        box-shadow .3s ease;

}

.boton:hover {

    transform:
        scale(1.06);

    background:
        rgba(60,80,130,0.35);

    box-shadow:

        0 0 28px rgba(130,160,230,0.3);

}

/* ==================================================
   AUTOS
================================================== */

.auto {

    position: absolute;

    border: none;

    background: transparent;

    font-size: 58px;

    cursor: pointer;

    z-index: 12;

    opacity: 0;

    transform:
        translateY(20px)
        scale(.8);

    transition:
        opacity 1.5s ease,
        transform 1.5s ease,
        filter .3s ease;

    filter:
        drop-shadow(0 8px 10px rgba(0,0,0,.45))
        drop-shadow(0 0 12px rgba(255,120,50,.25));

}
    
.auto img {

    width: 150px;

    height: auto;

    display: block;

    pointer-events: none;

}
    
.auto-1 {

    left: 24%;

    bottom: 25%;

}
 .auto-2 {

    right: 24%;

    bottom: 25%;

 }

.auto.visible {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);

}

.auto.visible:hover {

    transform:
        translateY(-8px)
        scale(1.08);

}

/* ==================================================
   MENSAJES
================================================== */

.mensaje {

    position: absolute;

    left: 50%;
    bottom: 10%;

    transform:
        translate(-50%, 30px);

    width:
        min(600px, 85%);

    padding:
        24px 30px;

    border-radius: 20px;

    background:
        rgba(5,12,28,0.48);

    border:
        1px solid rgba(220,230,255,0.16);

    backdrop-filter:
        blur(12px);

    color:
        rgba(245,247,255,0.92);

    text-align: center;

    font-size: 17px;

    line-height: 1.6;

    box-shadow:
        0 15px 50px rgba(0,0,0,0.25);

    opacity: 0;

    z-index: 15;

    transition:
        opacity 1.4s ease,
        transform 1.4s ease;

    cursor: pointer;

}

.mensaje.visible {

    opacity: 1;

    transform:
        translate(-50%, 0);

}


/* ==================================================
   TRANSICIÓN NOCHE → ATARDECER
================================================== */

.escena.atardecer-1
.oscuridad {

    background:

        linear-gradient(
            to bottom,
            rgba(15,25,65,0.40),
            rgba(25,30,70,0.25),
            rgba(10,15,35,0.45)
        );

}

    
.escena.atardecer-2
.oscuridad {

    background:

        linear-gradient(
            to bottom,
            rgba(45,35,80,0.38),
            rgba(90,55,90,0.22),
            rgba(20,20,45,0.38)
        );

}


.escena.atardecer-3
.oscuridad {

    background:

        linear-gradient(
            to bottom,
            rgba(105,55,90,0.30),
            rgba(160,75,90,0.18),
            rgba(35,25,45,0.32)
        );

}


.escena.atardecer-final
.oscuridad {

    background:

        linear-gradient(
            to bottom,
            rgba(190,90,90,0.18),
            rgba(220,125,100,0.12),
            rgba(40,30,45,0.25)
        );

}


/* ==================================================
   LUNA / NOCHE
================================================== */

.escena.atardecer-2
.luz-luna {

    opacity: .7;

}


.escena.atardecer-3
.luz-luna {

    opacity: .35;

    transform:
        scale(.9);

}


.escena.atardecer-final
.luz-luna {

    opacity: 0;

}


/* ==================================================
   ESTRELLAS
================================================== */

.escena.atardecer-2
.estrellas {

    opacity: .55;

}


.escena.atardecer-3
.estrellas {

    opacity: .25;

}


.escena.atardecer-final
.estrellas {

    opacity: 0;

}


/* ==================================================
   LUCIÉRNAGAS
================================================== */

.escena.atardecer-3
.luciernagas {

    opacity: .45;

}


.escena.atardecer-final
.luciernagas {

    opacity: .9;

}

</style>
</head>


<body>

<div
    class="escena"
    id="escena"
>


    <!-- OSCURIDAD SUAVE -->

    <div
        class="oscuridad"
    ></div>


    <!-- LUZ DE LUNA -->

    <div
        class="luz-luna"
    ></div>


    <!-- ESTRELLAS -->

    <div
        class="estrellas"
    >

        <span
            class="estrella"
            style="top:10%;left:27%;"
        ></span>

        <span
            class="estrella"
            style="top:18%;left:40%;"
        ></span>

        <span
            class="estrella"
            style="top:12%;left:54%;"
        ></span>

        <span
            class="estrella"
            style="top:27%;left:68%;"
        ></span>

        <span
            class="estrella"
            style="top:20%;left:82%;"
        ></span>

        <span
            class="estrella"
            style="top:35%;left:15%;"
        ></span>

        <span
            class="estrella"
            style="top:30%;left:57%;"
        ></span>

        <span
            class="estrella"
            style="top:8%;left:90%;"
        ></span>

        <span
            class="estrella"
            style="top:40%;left:38%;"
        ></span>

        <span
            class="estrella"
            style="top:24%;left:6%;"
        ></span>

    </div>


    <!-- NIEBLA -->

    <div
        class="niebla"
    ></div>


    <!-- LUCIÉRNAGAS -->

    <div
        class="luciernagas"
    >

        <span
            class="luz"
            style="left:18%;bottom:22%;"
        ></span>

        <span
            class="luz"
            style="left:31%;bottom:15%;animation-delay:1s;"
        ></span>

        <span
            class="luz"
            style="left:45%;bottom:27%;animation-delay:2s;"
        ></span>

        <span
            class="luz"
            style="left:65%;bottom:20%;animation-delay:.5s;"
        ></span>

        <span
            class="luz"
            style="left:78%;bottom:30%;animation-delay:1.5s;"
        ></span>

        <span
            class="luz"
            style="left:87%;bottom:18%;animation-delay:2.5s;"
        ></span>

    </div>


    <!-- ======================================
         INICIO
    ======================================= -->

    <div
        class="inicio"
        id="inicio"
    >

        <div
            class="titulo"
        >
            Para alguien especial
        </div>

        <div
            class="subtitulo"
        >
            Hay un pequeño viaje esperándote... 🌙
        </div>

        <button
            class="boton"
            onclick="comenzar()"
        >
            Empezar ✦
        </button>

    </div>

<!-- ======================================
     PRIMER AUTO
======================================= -->

<button
    class="auto auto-1"
    id="auto1"
    onclick="abrirAuto(1)"
    aria-label="Primer mensaje"
>
     🏎️
</button>

    <button
    class="auto auto-2"
    id="auto2"
    onclick="abrirAuto(2)"
    aria-label="Segundo mensaje"
>
    🏎️
</button>
    
    <!-- ======================================
         MENSAJE
    ======================================= -->

    <div
        class="mensaje"
        id="mensaje"
    >

        <p
            id="textoMensaje"
        ></p>

    </div>


</div>


<script>

/* ==========================================
   VARIABLES
========================================== */

let paso = 0;


const escena =
    document.getElementById(
        "escena"
    );


const inicio =
    document.getElementById(
        "inicio"
    );


const mensaje =
    document.getElementById(
        "mensaje"
    );


const textoMensaje =
    document.getElementById(
        "textoMensaje"
    );


/* ==========================================
   MENSAJES
========================================== */

const mensajes = [

    "Quería hacerte una pequeña cosa... simplemente porque pensé en ti.",

    "Hay momentos pequeños contigo que recuerdo y que me hacen sonreír.",

    "Gracias por escucharme y por preguntarme cómo estoy.",

    "Admiro que, incluso cuando las cosas se ponen difíciles, sigas intentando avanzar.",

    "Y sí... seguiré diciéndote nuv y viejito cuando te quejes de algo. 🥺",

    "Hay una última cosa que quiero decirte..."

];


/* ==========================================
   COMENZAR
========================================== */

function comenzar() {

    inicio.classList.add(
        "oculto"
    );


    setTimeout(() => {

         document
            .getElementById("auto1")
            .classList.add("visible");

    }, 1600);

}


/* ==========================================
   MOSTRAR MENSAJE
========================================== */

function mostrarMensaje() {

    if (
        paso >= mensajes.length
    ) {

        return;

    }


    textoMensaje.innerText =
        mensajes[paso];


    mensaje.classList.remove(
        "visible"
    );


    setTimeout(() => {

        mensaje.classList.add(
            "visible"
        );

    }, 250);


    cambiarPaisaje(
        paso
    );


    paso++;

}


/* ==========================================
   CAMBIAR PAISAJE
========================================== */

function cambiarPaisaje(
    numero
) {

    escena.classList.remove(

        "atardecer-1",
        "atardecer-2",
        "atardecer-3",
        "atardecer-final"

    );


    if (
        numero === 1
    ) {

        escena.classList.add(
            "atardecer-1"
        );

    }


    if (
        numero === 2
    ) {

        escena.classList.add(
            "atardecer-2"
        );

    }


    if (
        numero === 3
    ) {

        escena.classList.add(
            "atardecer-3"
        );

    }


    if (
        numero >= 4
    ) {

        escena.classList.add(
            "atardecer-final"
        );

    }

}


/* ==========================================
   TOCAR MENSAJE PARA CONTINUAR
========================================== */

mensaje.addEventListener(
    "click",
    mostrarMensaje
);
    
function abrirAuto(numero) {

    if (numero === 1) {

        document
            .getElementById("auto1")
            .classList.remove("visible");

        mostrarMensaje();

        setTimeout(() => {

            document
                .getElementById("auto2")
                .classList.add("visible");

        }, 1800);

    }


    if (numero === 2) {

        document
            .getElementById("auto2")
            .classList.remove("visible");

        mostrarMensaje();

    }

}
</script>

</body>
</html>
